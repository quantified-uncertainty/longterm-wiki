properties:

  # ── Financial ────────────────────────────────────────────────

  revenue:
    name: Revenue
    description: "Annualized run-rate revenue (ARR) or trailing twelve-month revenue"
    dataType: number
    unit: USD
    category: financial
    temporal: true
    appliesTo: [organization]
    display:
      divisor: 1e9
      prefix: "$"
      suffix: "B"

  valuation:
    name: Valuation
    description: "Post-money valuation at most recent funding round or mark-to-market"
    dataType: number
    unit: USD
    category: financial
    temporal: true
    appliesTo: [organization]
    display:
      divisor: 1e9
      prefix: "$"
      suffix: "B"

  headcount:
    name: Headcount
    description: "Total full-time employee count"
    dataType: number
    unit: employees
    category: financial
    temporal: true
    appliesTo: [organization]
    display:
      suffix: " employees"

  total-funding:
    name: Total Funding Raised
    description: "Cumulative capital raised across all funding rounds"
    dataType: number
    unit: USD
    category: financial
    temporal: true
    appliesTo: [organization]
    display:
      divisor: 1e9
      prefix: "$"
      suffix: "B"

  funding-received:
    name: Funding Received
    description: "A specific grant or funding amount received from a grantor"
    dataType: number
    unit: USD
    category: financial
    temporal: true
    appliesTo: [organization]
    display:
      prefix: "$"

  # ── People & Relationships ────────────────────────────────────

  employed-by:
    name: Employed By
    description: "Organization this person currently or historically works for"
    dataType: ref
    category: people
    temporal: true
    appliesTo: [person]
    inverseId: employer-of
    inverseName: Employs

  employer-of:
    name: Employs
    description: "People employed by this organization (computed from employed-by facts)"
    dataType: refs
    category: people
    appliesTo: [organization]
    inverseId: employed-by
    inverseName: Employed By
    computed: true

  role:
    name: Role / Title
    description: "Job title or role at primary employer"
    dataType: text
    category: people
    temporal: true
    appliesTo: [person]

  education:
    name: Education
    description: "University degree or highest educational attainment"
    dataType: text
    category: biographical
    appliesTo: [person]

  notable-for:
    name: Notable For
    description: "What this person is primarily known for (one-line summary)"
    dataType: text
    category: biographical
    appliesTo: [person]

  net-worth:
    name: Net Worth
    description: "Estimated net worth (for public figures with reliable estimates)"
    dataType: number
    unit: USD
    category: biographical
    temporal: true
    appliesTo: [person]
    display:
      divisor: 1e9
      prefix: "$"
      suffix: "B"

  social-media:
    name: Social Media
    description: "Primary social media handle (e.g., Twitter/X @handle)"
    dataType: text
    category: biographical
    appliesTo: [person]

  google-scholar:
    name: Google Scholar
    description: "Google Scholar profile URL"
    dataType: text
    category: biographical
    appliesTo: [person]

  github-profile:
    name: GitHub
    description: "GitHub profile URL"
    dataType: text
    category: biographical
    appliesTo: [person]

  wikipedia-url:
    name: Wikipedia
    description: "Wikipedia article URL"
    dataType: text
    category: biographical
    appliesTo: [person]

  founded-by:
    name: Founded By
    description: "Person(s) or organization(s) that created this entity"
    dataType: refs
    category: people
    appliesTo: [organization, project]
    inverseId: founder-of
    inverseName: Founded

  founder-of:
    name: Founder Of
    description: "Organization(s) this person founded (computed from founded-by facts)"
    dataType: refs
    category: people
    appliesTo: [person]
    inverseId: founded-by
    inverseName: Founded By
