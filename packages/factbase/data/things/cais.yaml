  - id: f_cais_description
    property: description
    value: >-
      The Center for AI Safety (CAIS) is a San Francisco-based nonprofit focused on
      reducing societal-scale risks from AI through technical safety research,
      field-building, and public communication. Founded by Dan Hendrycks and Oliver
      Zhang. Known for the MMLU benchmark, representation engineering, and the May
      2023 "Statement on AI Risk" signed by 350+ AI leaders.
    asOf: 2025
    source: https://www.safe.ai/about

