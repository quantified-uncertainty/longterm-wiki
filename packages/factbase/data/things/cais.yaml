  - id: f_cais_statement_risk
    property: campaign
    value: "Statement on AI Risk (May 2023): one-sentence statement 'Mitigating the risk of extinction from AI should be a global priority alongside other societal-scale risks such as pandemics and nuclear war.' Signed by 350+ AI leaders including Geoffery Hinton, Demis Hassabis, Sam Altman, and Dario Amodei."
    asOf: 2023-05
    source: https://www.safe.ai/statement-on-ai-risk

