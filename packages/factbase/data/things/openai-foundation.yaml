facts:
  # ── Description & Basics ──────────────────────────────────────
  - id: joTH3WxeeA
    property: description
    value: >-
      501(c)(3) nonprofit (formerly OpenAI, Inc.) that retains governance
      control over OpenAI Group PBC through sole authority to appoint and
      remove all PBC board directors. Holds a 26% equity stake valued at
      approximately $130 billion. Operates the Safety and Security Committee
      with power to halt model releases. Committed $1 billion in grants for
      2026-2027 across health, AI resilience, economic impact, and civil
      society programs.
    asOf: 2026-03
    source: https://openai.com/index/update-on-the-openai-foundation/

  - id: 1Jtk2L1nwg
    property: founded-date
    value: "2015-12"
    source: https://openai.com/our-structure/
    notes: >-
      Originally founded as OpenAI, Inc. in December 2015 by Sam Altman,
      Elon Musk, Ilya Sutskever, Greg Brockman, and others. Renamed to
      OpenAI Foundation in October 2025 as part of corporate restructuring.

  - id: pB7UyS39sw
    property: legal-structure
    value: "501(c)(3) nonprofit (Delaware)"
    source: https://openai.com/our-structure/
    notes: "Renamed from OpenAI, Inc. to OpenAI Foundation on October 28, 2025"

  - id: Z8sfmSxNtw
