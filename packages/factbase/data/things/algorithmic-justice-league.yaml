  - id: f_n1IL7VXouL
    property: publication
    value: "Gender Shades study (2018) by Buolamwini and Gebru demonstrated intersectional accuracy disparities in commercial facial recognition from IBM, Microsoft, and Face++. Dark-skinned women had highest error rates; light-skinned men had lowest. Over 4,900 citations on Semantic Scholar."
    asOf: 2026-03
    source: https://www.semanticscholar.org/paper/Gender-Shades:-Intersectional-Accuracy-Disparities-Buolamwini-Gebru/18858cc936947fc96b5c06bbe3c6c2faa5614540
    notes: "Citation count as of March 2026. IBM issued a public response acknowledging the research. Study shaped industry practice, policy agendas, and academic research."

  - id: f_QY6TVHSOt4
    property: documentary
    value: "Coded Bias (2020), directed by Shalini Kantayya, premiered at Sundance Film Festival. 90 minutes. Released on Netflix April 5, 2021 and broadcast on PBS Independent Lens. 100% Rotten Tomatoes score (52 reviews, 7.9/10 average). Emmy-nominated for Outstanding Science/Technology Documentary."
    asOf: 2021
    source: https://en.wikipedia.org/wiki/Coded_Bias
    notes: "Also won Calgary IFF Best International Documentary, Social Impact Media Awards Best Director, and was nominated for NAACP Image Award Outstanding Documentary."

