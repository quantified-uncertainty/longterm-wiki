facts:
  # ── Description ────────────────────────────────────────────────
  - id: f_Jrkhe2gj6g
    property: description
    value: >-
      The UK's Advanced Research + Invention Agency (ARIA) is a government research
      funding body established by the ARIA Act 2022, modeled on DARPA. Its flagship
      Safeguarded AI programme commits GBP 59 million over 3-5 years to develop AI
      systems with mathematical safety guarantees through formal verification, funding
      48 projects across 6 technical areas. A Nov 2025 pivot expanded TA1 scope,
      abandoned TA2 Phase 2, and cancelled TA3 Phase 2, shifting focus toward broader
      mathematical assurance and formally-verified cybersecurity firewalls.
    asOf: 2026-03

  # ── Organizational ─────────────────────────────────────────────
  - id: f_3wJxqEXuHw
    property: founded-date
    value: !date 2022
    source: https://www.legislation.gov.uk/ukpga/2022/3/enacted
    notes: "ARIA Act received Royal Assent 24 February 2022"

  - id: f_OBZXLAXPsw
    property: website
    value: https://www.aria.org.uk

  - id: f_6dK88iryEw
    property: headquarters
    value: "London, UK"
    source: https://www.aria.org.uk

  - id: f_l4ARCZFnLQ
    property: legal-structure
    value: "Non-departmental public body (UK government agency)"
    source: https://www.legislation.gov.uk/ukpga/2022/3/enacted
    notes: "Established by the Advanced Research and Invention Agency Act 2022; reports to DSIT"

  # ── Safeguarded AI Programme Budget ────────────────────────────
  - id: f_d7uLELQ2tA
    property: total-grants-made
    value: 59000000
    asOf: 2025-11
    source: https://www.aria.org.uk/programme-safeguarded-ai/
    notes: >-
      GBP 59M total Safeguarded AI programme budget across all technical areas
      (TA1.1: GBP 3.5M/22 projects, TA1.2+1.3: GBP 14.2M, TA1.4: GBP 3.4M,
      TA2: GBP 1M Phase 1, TA3: GBP 5.4M/9 projects). Value in GBP not USD.

  - id: f_w45Zf05dCw
    property: grant-count
    value: 48
    asOf: 2025-11
    source: https://www.aria.org.uk/programme-safeguarded-ai/
    notes: "48 funded projects across 6 technical areas in the Safeguarded AI programme"

  # ── Key Personnel ──────────────────────────────────────────────
  - id: f_PbXY92etig
    property: description
    value: "Programme Director: David 'davidad' Dalrymple (since 2023)"
    asOf: 2023
    source: https://www.aria.org.uk/programme-safeguarded-ai/

  - id: f_ZLM6Wsw64w
    property: description
    value: "Scientific Director: Yoshua Bengio (joined Aug 2024)"
    asOf: 2024-08
    source: https://ariaresearch.substack.com/p/yoshua-bengio-joins-safeguarded-ai

  - id: f_L8Bx7t71DQ
    property: description
    value: "Incoming CEO: Kathleen Fisher (former DARPA HACMS programme manager)"
    asOf: 2025-11
    source: https://www.aria.org.uk/insights/ai-progress-and-a-safeguarded-ai-pivot/

  # ── Nov 2025 Pivot ─────────────────────────────────────────────
  - id: f_oZIpAVKt6Q
    property: description
    value: >-
      Nov 2025 strategic pivot: expanded TA1 scope to broader mathematical assurance
      (beyond pure formal verification), abandoned TA2 Phase 2 (GBP 18M ML track),
      cancelled TA3 Phase 2 (GBP 8.4M applications track), and added a cybersecurity
      focus on formally-verified firewalls for critical infrastructure.
    asOf: 2025-11
    source: https://www.aria.org.uk/insights/ai-progress-and-a-safeguarded-ai-pivot/
    notes: "Pivot motivated by rapid AI progress outpacing the original programme timeline"

  # ── Parent Organization ────────────────────────────────────────
  - id: f_YMiDCNN37A
    property: parent-org
    value: "UK Department for Science, Innovation and Technology (DSIT)"
    asOf: 2023
    source: https://www.legislation.gov.uk/ukpga/2022/3/enacted
    notes: "ARIA reports to DSIT but operates with significant independence by statute"
