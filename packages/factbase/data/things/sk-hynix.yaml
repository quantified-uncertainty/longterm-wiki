  # ── Description ─────────────────────────────────────────────────
  - id: f_skh_desc
    property: description
    value: >-
      World's leading producer of high-bandwidth memory (HBM), a critical component
      in AI training GPUs. HBM is a key bottleneck in the AI chip supply chain —
      Nvidia's H100, H200, and Blackwell GPUs depend on HBM supplied primarily by
      SK Hynix and Samsung. Also a major DRAM and NAND flash producer.
    asOf: 2026-03

