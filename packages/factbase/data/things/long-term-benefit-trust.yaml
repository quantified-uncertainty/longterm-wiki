  # ── Description & Basics ──────────────────────────────────────
  - id: mFQWGv20mw
    property: description
    value: >-
      Delaware purpose trust established in 2023 to ensure Anthropic responsibly
      develops AI for humanity's long-term benefit. Holds Class T Common Stock
      with negligible economic value but phased governance power over Anthropic's
      board of directors. Trustees are financially disinterested.
    asOf: 2026-03
    source: https://www.anthropic.com/news/the-long-term-benefit-trust

  - id: V291KEL6Gw
    property: founded-date
    value: "2023-05"
    source: https://www.anthropic.com/news/the-long-term-benefit-trust
    notes: >-
      Charter amended to create Class T stock at Series C close (May 2023).
      Public announcement September 2023.

  - id: UI4HRaqZ6w
    property: legal-structure
    value: "Delaware purpose trust (Del. Code tit. 12 §3556)"
    source: https://corpgov.law.harvard.edu/2023/10/28/anthropic-long-term-benefit-trust/
    notes: >-
      Novel application of Delaware trust law. Purpose trusts serve a stated
      purpose rather than specific beneficiaries.

  - id: 2kMkA1152A
    property: headquarters
    value: "San Francisco, CA"
    source: https://www.anthropic.com/company

  - id: 0l8jfTS09A
    property: country
    value: United States

  - id: 4xVl0chsLA
    property: website
    value: https://www.anthropic.com/news/the-long-term-benefit-trust

  - id: 5K0FnbVnJw
    property: parent-org
    value: !ref sid_mK9pX3rQ7n
    source: https://www.anthropic.com/news/the-long-term-benefit-trust
    notes: "Governance body of Anthropic PBC"

  - id: KgiuN0sFnA
    property: notable-for
    value: >-
      First major AI company to establish an independent governance trust with
      board-majority appointment power. Designed to prioritize humanity's
      long-term interests over short-term financial pressures.
    source: https://www.anthropic.com/news/the-long-term-benefit-trust

