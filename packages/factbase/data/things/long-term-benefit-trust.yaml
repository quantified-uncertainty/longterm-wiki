    value: >-
      Full Trust Agreement has never been published, limiting independent
      assessment. The Certificate of Incorporation is publicly available via
      Delaware filing but contains less detail than the Trust Agreement.
    source: https://ailabwatch.org/blog/anthropic-certificate-of-incorporation

  - id: uFfpkAWUCw
    property: notable-for
    value: >-
      Trustees are self-perpetuating: new trustees elected by existing trustees,
      in consultation with Anthropic's directors and CEO. One-year terms with
      regular peer re-evaluation.
    source: https://www.anthropic.com/news/the-long-term-benefit-trust
