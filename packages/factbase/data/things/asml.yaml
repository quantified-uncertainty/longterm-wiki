  # ── Description ─────────────────────────────────────────────────
  - id: f_asml_desc
    property: description
    value: >-
      Sole global supplier of extreme ultraviolet (EUV) lithography machines required
      to manufacture chips at advanced nodes (sub-7nm). ASML's monopoly on EUV technology
      makes it one of the most critical chokepoints in the AI chip supply chain. Dutch
      export restrictions on ASML equipment are among the most effective levers in chip
      governance.
    asOf: 2026-03

