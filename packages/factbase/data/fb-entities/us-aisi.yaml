    notes: "Rough estimate; CAISI does not publish headcount. The careers page lists six technical teams (Agent Security, Applied Systems, Chem/Bio, Cyber, Frontier Assessment, Partnerships) with roughly a dozen open positions as of April 2026. Actively hiring."

