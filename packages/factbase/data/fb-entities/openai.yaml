    notes: "Cumulative primary funding through SoftBank's $40B round (March 2025) at a $300B valuation. Bottom-up sum of
      documented primary rounds: $1B founding pledge (2015) + $1B Microsoft (2019) + $1B Series (2021) + $300M Series
