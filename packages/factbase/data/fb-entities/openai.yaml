      pledge (most of which was never realized) from its cumulative figure. The October 2025 PBC restructuring at $500B
      valuation was a recapitalization / secondary-tender event, not a new primary round, so the total-primary figure
      was unchanged through that event. Superseded by the $122B March 2026 primary round (see f_QNOH7UIrtg)."

