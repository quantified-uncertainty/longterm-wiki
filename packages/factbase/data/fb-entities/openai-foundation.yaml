  # ── Restructuring Timeline ────────────────────────────────────
  - id: f_UAp6eSLEdi
    property: key-event
    value: "OpenAI announces plan to restructure into PBC; initial plan would have removed nonprofit governance control"
    asOf: 2024-12
    source: https://openai.com/index/why-our-structure-must-evolve-to-advance-our-mission/
    notes: "OpenAI framed this as evolving the mission; critics saw it as removing nonprofit control."

  - id: f_zRdcodpFXV
    property: key-event
    value: "California AG investigation into OpenAI restructuring (ongoing since ~mid-2024, concluded Oct 2025)"
    asOf: 2024-06
    source: https://oag.ca.gov/news/press-releases/attorney-general-bonta-issues-statement-openai%E2%80%99s-recapitalization-plan
    notes: "AG Bonta stated investigation was conducted over 'the last year and a half' as of Oct 2025"

  - id: f_p5rlqfQub5
