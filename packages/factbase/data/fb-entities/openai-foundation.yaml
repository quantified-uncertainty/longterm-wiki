    value: 1e+9
    asOf: 2026-03
    source: https://openai.com/index/update-on-the-openai-foundation/
    notes: "$1 billion pledged over the next year (2026-2027)"

  - id: f_17jLKyZyCS
    property: grant-commitment
    value: 2.5e+10
    asOf: 2025-10
    source: https://openai.com/index/built-to-benefit-everyone/
    notes: "$25 billion long-term commitment (no fixed timeline). For health/disease and AI resilience."

  - id: f_9fdoxJRBbz
    property: key-event
    value: "Profit cap removed as part of PBC restructuring"
    asOf: 2025-10
    source: https://openai.com/index/built-to-benefit-everyone/
    notes: >-
      Under old structure, investors had a 100x profit cap with excess flowing to the nonprofit. Under PBC structure,
      all shareholders hold regular equity.

  # ── Governance Powers ─────────────────────────────────────────
  - id: f_779CnxmsqR
    property: board-seats-controlled
    value: "All PBC board seats (sole appointment and removal authority)"
    asOf: 2025-10
    source: https://openai.com/our-structure/
    notes: "Foundation has sole power and authority to appoint all PBC board members and can remove directors at any time"

  - id: f_8UyibnXaKk
    property: notable-for
    value: >-
      Safety and Security Committee (SSC) is a committee of the Foundation, not the PBC. Chaired by Zico Kolter. Has
      authority to require mitigation measures including halting the release of models or AI systems.
    asOf: 2025-10
    source: https://openai.com/our-structure/

  - id: f_ibLaDPDe03
    property: notable-for
    value: >-
      SSC Chair (Zico Kolter) serves as a non-voting observer at PBC board meetings. Kolter sits exclusively on the
      Foundation board, not the PBC board.
    source: https://openai.com/our-structure/
    notes: "Source says 'non-voting observer', not 'full observation rights'"

  - id: f_LC9szgfCnW
    property: notable-for
    value: >-
      Non-independent directors (including Sam Altman) barred from PBC Audit & Risk, Compensation, and Nominating &
      Governance committees per California AG conditions.
    source: https://oag.ca.gov/news/press-releases/attorney-general-bonta-issues-statement-openai%E2%80%99s-recapitalization-plan

  - id: f_7RXmQ9V719
    property: notable-for
    value: "OpenAI must remain headquartered in California per AG condition"
    source: https://oag.ca.gov/news/press-releases/attorney-general-bonta-issues-statement-openai%E2%80%99s-recapitalization-plan

