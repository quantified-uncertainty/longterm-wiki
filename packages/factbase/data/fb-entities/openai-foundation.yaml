  # ── Litigation ────────────────────────────────────────────────
  - id: f_BMpElfpybY
    property: litigation
    value: "Musk v. OpenAI: jury trial scheduled April-May 2026"
    asOf: 2026-01
    source: https://techcrunch.com/2026/01/08/elon-musks-lawsuit-against-openai-will-face-a-jury-in-march/
    notes: >-
      Musk alleges betrayal of nonprofit mission. Contributed ~$38M (~60% of early funding). Potential damages
      $78B-$135B. OpenAI countersued.

  - id: f_Q9Pac25WbT
    property: litigation
    value: "Elon Musk files lawsuit against OpenAI alleging betrayal of nonprofit mission"
    asOf: 2024-02
    source: https://time.com/7328674/openai-chatgpt-sam-altman-elon-musk-timeline/

  # ── Ownership Structure Context ───────────────────────────────
  - id: f_Rt5gOPJrBk
    property: notable-for
    value: >-
      Post-restructuring equity: Foundation 26%, Microsoft 27%, employees 26%, other investors ~21%. Sam Altman received
      no equity in the restructuring despite earlier reports of up to $10.5B.
    asOf: 2025-10
    source: https://openai.com/index/built-to-benefit-everyone/

  - id: f_EF2KTNuKaT
    property: notable-for
    value: >-
      Critics argue 26% financial stake is a dramatic reduction from 100% control under the old structure. Board overlap
      between Foundation and PBC raises questions about real independence. OpenAI dropped "safely" from its mission
      statement during the restructuring.
    source: https://calmatters.org/economy/technology/2025/10/openai-restructuring-deal-full-of-holes-critics-say/

  - id: f_WpFiWndfS0
    property: notable-for
    value: >-
      Four focus areas announced March 2026: (1) Life Sciences & Curing Diseases, (2) Jobs and Economic Impact, (3) AI
      Resilience, (4) Community Programs including People-First AI Fund.
    asOf: 2026-03
    source: https://openai.com/index/update-on-the-openai-foundation/

  - id: f_Aciv657R2Y
    property: wikipedia-url
    value: https://en.wikipedia.org/wiki/OpenAI
    notes: "Foundation shares Wikipedia article with OpenAI Group"
    source: https://en.wikipedia.org/wiki/OpenAI
