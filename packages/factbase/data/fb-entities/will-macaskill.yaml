  - id: f_ai1K4HXqHA
    property: description
    value: >-
      Will MacAskill is a Scottish moral philosopher and a central figure in the effective altruism (EA) movement. In
      2009, he co-founded Giving What We Can with Toby Ord, encouraging members to pledge 10% of their income to highly
      effective charities. He also co-founded the Centre for Effective Altruism and 80,000 Hours in 2011. His 2015 book
      "Doing Good Better" popularized EA principles, and his 2022 book "What We Owe the Future" made the case for
      longtermism—the view that we should give significant weight to future generations—bringing widespread attention to
      existential risk and AI safety. He left his Associate Professor position at Oxford in 2024 to become Senior
      Research Fellow at Forethought, focusing on AGI preparedness, space governance, and AI rights.
    asOf: 2026-03
    notes: Updated to reflect current role at Forethought (left Oxford 2024)

