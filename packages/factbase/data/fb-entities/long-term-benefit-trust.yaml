  # ── Description & Basics ──────────────────────────────────────
  - id: f_QSjnEujOZC
    property: description
    value: >-
      Delaware purpose trust established in 2023 to ensure Anthropic responsibly develops AI for humanity's long-term
      benefit. Holds Class T Common Stock with negligible economic value but phased governance power over Anthropic's
      board of directors. Trustees are financially disinterested.
    asOf: 2026-03
    source: https://www.anthropic.com/news/the-long-term-benefit-trust

  - id: f_dBsURz3zHz
    property: founded-date
    value: "2023-05"
    source: https://www.anthropic.com/news/the-long-term-benefit-trust
    notes: >-
      Charter amended to create Class T stock at Series C close (May 2023). Public announcement September 2023.

  - id: f_GQTC3EDHXN
    property: legal-structure
    value: "Delaware purpose trust (Del. Code tit. 12 §3556)"
    source: https://corpgov.law.harvard.edu/2023/10/28/anthropic-long-term-benefit-trust/
    notes: >-
      Novel application of Delaware trust law. Purpose trusts serve a stated purpose rather than specific beneficiaries.

  - id: f_7IjcCU3Ou9
    property: headquarters
    value: "San Francisco, CA"
    source: https://www.anthropic.com/company

