# TableBase Organization Research Notes
# Notes from enrichment runs — helps future sessions know where to find data.
# Format: entityId → notes about team page URLs, data sources, quirks.

# Anthropic (A4XoubikkQ) — stableId for the Anthropic entity used by DeepMind records
# Note: A4XoubikkQ is actually Google DeepMind's ID. Anthropic records were written
# to the correct org but some early API mode records used wrong entity.

google-deepmind:
  entityId: A4XoubikkQ
  teamPage: null  # No public team page. Board at /company (JS-rendered, needs Playwright fetch-page).
  notes: |
    WebFetch on anthropic.com/company returns board only (Dario, Daniela, Yasmin Razavi, Jay Kreps, Reed Hastings, Chris Liddell).
    Playwright fetch-page works for the same page. No staff directory — researchers found via WebSearch + Wikipedia.

anthropic:
  entityId: A4XoubikkQ  # Same ID issue — check this
  notes: |
    Board visible at anthropic.com/company (JS-rendered). No public staff directory.
    Key researchers found via WebSearch. Many co-founders are in the DB already.

openai:
  entityId: "265"
  notes: |
    Personnel added to main OpenAI entity. Board/exec team found via WebSearch.
    Many executives not in entity DB — had to create them.

openai-foundation:
  entityId: GQuPhNkZbg
  notes: |
    Board formed October 28, 2025. All board members from openai.com/our-structure.
    Sam Altman co-founded OpenAI in 2015.

open-philanthropy:
  entityId: "263"
  teamPage: https://coefficientgiving.org/about-us/team
  notes: |
    Renamed to Coefficient Giving in November 2025. openphilanthropy.org redirects to coefficientgiving.org.
    Team page has 140+ people with exact roles and departments. Extremely rich data source.
    Only Holden Karnofsky and Dustin Moskovitz were in the DB — most staff need entity creation.

redwood-research:
  entityId: "289"
  teamPage: https://www.redwoodresearch.org/team
  notes: |
    Team page lists Buck Shlegeris (CEO), Ryan Greenblatt (Chief Scientist),
    and board (Buck, Nate Thomas, Ammon Bartram). Technical staff names visible but no titles.

80000-hours:
  entityId: hvg9ecR3nA
  teamPage: https://80000hours.org/about/meet-the-team/
  notes: |
    Excellent team page — 51 staff + 5 board + 5 advisors with exact titles.
    Founded 2011 by Benjamin Todd and Will MacAskill. Current CEO is Niel Bowerman.
    Note: We only submitted the 2 founders. Could go much deeper.

