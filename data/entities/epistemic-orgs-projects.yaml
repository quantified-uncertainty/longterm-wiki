# Organizations
- id: quri
  stableId: sid_Khej79OA8g
  wikiId: E238
  type: organization
  orgType: safety-org
  title: QURI (Quantified Uncertainty Research Institute)
  website: https://quantifieduncertainty.org
  description: >-
    Nonprofit research organization developing tools for probabilistic reasoning,
    forecasting, and epistemic infrastructure. Key projects include Squiggle
    (probabilistic programming language), Squiggle Hub (model sharing platform),
    Metaforecast (forecast aggregation), SquiggleAI (LLM-powered estimation),
    RoastMyPost (LLM-powered content evaluation), and Guesstimate (spreadsheet
    for distributions). Founded in 2019 by Ozzie Gooen, evolved from earlier
    Guesstimate work (2016). Based in Berkeley, CA; primarily remote team of
    ~3-5 core contributors. Fiscally sponsored by Rethink Priorities. Funded by
    Survival and Flourishing Fund ($650K through 2022), Future Fund ($200K, 2022),
    and Long-Term Future Fund (ongoing). EIN 84-3847921.
