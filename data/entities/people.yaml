- id: ben-goldhaber
  stableId: 0tQftJKP4Q
  type: person
  title: Ben Goldhaber
  description: >-
    Projects Lead at the Future of Life Foundation since early 2025, focused
    on incubating teams working on differentially beneficial technology.
    Former Director of FAR.Labs (mid-2023 to early 2025). Board member of
    QURI. Prior roles at Google, Cadmea, Hash, and Ought. Directed the
    inaugural AI for Human Reasoning Fellowship (30 fellows, Summer 2025).
    Co-authored "A Knowledge Commons for the 21st Century" (Dec 2025) with
    Oliver Sourbut, proposing three-layer epistemic infrastructure: Ingestion
    Layer (cryptographic provenance), Structure Layer (inference and discourse
    mapping), and Assessment Layer (customizable credence computation). Led
    the technical roadmapping workshop that produced "Towards Guaranteed Safe
    AI" (arXiv:2405.06624, co-authored with Yoshua Bengio, Stuart Russell,
    Max Tegmark, and 13 others). Writes the "Gold Takes" Substack newsletter.
    Focus areas include AI-assisted provably secure software, AI-enhanced
    forecasting and sensemaking, and positive future visions through
    coordination mechanisms he calls "hyper-entities."
