  description: |
    Holden Karnofsky is the former Co-CEO of Coefficient Giving (formerly Open Philanthropy), one of the largest funders of AI safety research and related work. Through Coefficient Giving, he directed hundreds of millions of dollars toward reducing existential risks from AI, making him one of the most influential figures in shaping the field's growth and direction. In 2025, he joined Anthropic.

    Karnofsky's intellectual contributions have been equally significant. His "Most Important Century" series of blog posts on Cold Takes presents a detailed argument that the 21st century could be the most pivotal in human history due to transformative AI. He has developed frameworks for thinking about AI timelines, the potential for a "galaxy-brained" AI to manipulate humans, and how philanthropic funding should be allocated given deep uncertainty about AI trajectories.

    Before focusing on AI risk, Karnofsky co-founded GiveWell, a charity evaluator that became the intellectual foundation for effective altruism. His transition to prioritizing AI safety reflects a broader shift in the EA movement. Through Coefficient Giving's grants to organizations like Anthropic, MIRI, Redwood Research, and many others, Karnofsky helped build the institutional infrastructure of AI safety as a field.
