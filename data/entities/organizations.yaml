  title: Huawei
  website: https://www.huawei.com
  description: >-
    Huawei Technologies is a Chinese multinational technology company that, through its
    HiSilicon subsidiary, designs the Ascend series of AI accelerator chips. Huawei was
    placed on the U.S. Entity List in May 2019. Despite export restrictions cutting off
    access to TSMC fabrication and advanced EDA tools, Huawei has continued AI chip
    development using SMIC's domestic fabrication capabilities. The Ascend 910B and 910C
    chips represent China's most advanced domestic AI accelerators. Huawei's ability to
    develop competitive AI chips despite sanctions is a key case study in the limits of
    export control effectiveness.
