- id: asml
  stableId: uW7R22grHt
  wikiId: E2607
  type: organization
  orgType: generic
  title: ASML
  website: https://www.asml.com
  description: >-
    ASML Holding NV is the sole global supplier of extreme ultraviolet (EUV) lithography
    machines, which are required to manufacture semiconductors at advanced nodes (sub-7nm).
    Headquartered in Veldhoven, Netherlands, and founded in 1984, ASML's monopoly on EUV
    technology makes it one of the most critical chokepoints in the AI chip supply chain.
    Dutch export restrictions on ASML equipment, aligned with U.S. policy, are among the
    most effective levers in the current chip governance architecture. ASML's systems cost
    $150-400M each. Annual revenue was approximately $28B in 2024.
  tags:
    - semiconductors
