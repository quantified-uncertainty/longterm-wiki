- id: bureau-of-industry-and-security
  stableId: GVy4_Tlsa-
  wikiId: E2611
  type: organization
  orgType: government
  title: Bureau of Industry and Security
  website: https://www.bis.gov
  description: >-
    The Bureau of Industry and Security (BIS) is an agency of the U.S. Department of
    Commerce responsible for administering the Export Administration Regulations (EAR),
    including export controls on advanced AI chips and semiconductor equipment. BIS
    maintains the Commerce Control List (CCL) and Entity List, and enforces the Foreign
    Direct Product Rule (FDPR). Since October 2022, BIS has been the primary regulatory
    body governing exports of high-performance AI chips, making it a central actor in
    AI chip governance. Critics note that BIS enforcement budgets are dwarfed by the
    profits from chip smuggling operations.
  tags:
