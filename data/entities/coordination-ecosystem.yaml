- id: kleros
  stableId: yXV7lgCSyC
  type: organization
  orgType: startup
  title: Kleros
  description: >-
    Decentralized arbitration protocol using crypto-economic incentives and Schelling-point
    game theory. Crowdsourced jurors stake tokens and are rewarded for voting with the
    majority. Kleros 2.0 deployed on Arbitrum One (November 2024). Now exploring AI agents
    as jurors. Argentina's Disposición 893/2025 opened regulatory path for Kleros-powered
    consumer dispute resolution. Stanford Law published a case study on Kleros as
    "decentralized justice."
  website: https://kleros.io
  tags:
    - arbitration
    - dispute-resolution
    - decentralized-justice
    - blockchain
    - governance
  clusters:
