- id: government-ai-monitoring
  stableId: sid_bidMivQo1W
  type: approach
  title: Government AI Use Monitoring
  description: "Systematic tracking and transparency efforts focused on how
    governments deploy AI systems, particularly for surveillance, enforcement,
    and decision-making that affects citizens' rights. Became critically
    important in 2025-2026 as the Trump administration rapidly expanded
    government AI use (nearly 3,000 AI use cases across 29 agencies in 2025, a
    75% increase over 2024). Key practitioners: Revolving Door Project
    (comprehensive \"Tracking Uses of AI in the Trump Administration\" tracker
    covering DOGE AI, CMS Medicare AI, ICE surveillance, State Department visa
    AI), Freedom House (Freedom on the Net annual reports, 15th consecutive year
    of internet freedom decline; specific reporting on AI-enabled immigration
    enforcement), Brennan Center (policing and technology program, AI and
    national security research series), and Tech Oversight Project
    (rapid-response media campaigns on tech accountability). FOIA litigation
    (Democracy Forward, ACLU) serves as an enforcement mechanism when voluntary
    transparency fails. The Revolving Door Project tracker is currently the most
    comprehensive single-source inventory of government AI deployments.
    State-level monitoring is thinner — the Brennan Center tracker covers state
    legislation but not state government AI deployments."
  tags:
    - government-monitoring
    - transparency
    - surveillance
    - accountability
