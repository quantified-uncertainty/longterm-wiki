- id: ai-litigation-democracy
  stableId: sid_Zl0fiVceDA
  type: approach
  title: AI Litigation as Democratic Defense
  description: 'Using courts to challenge government and corporate AI deployments
    that threaten democratic governance, civil rights, and privacy. Includes
    FOIA litigation to compel transparency about government AI use,
    constitutional challenges to AI-enabled surveillance, product liability
    suits against harmful AI systems, and challenges to federal preemption of
    state AI regulation. Key practitioners: ACLU (NSA AI FOIA, DOGE data
    access), Democracy Forward (FOIA on federal AI use for deregulation and
    employee monitoring), Protect Democracy (SNAP data "panopticon" suit), EFF
    (AI surveillance investigations), EPIC (housing AI litigation). The 36-state
    AG coalition opposing federal preemption represents the largest coordinated
    legal response. Litigation serves both direct (blocking harmful deployments)
    and indirect (establishing precedent, forcing disclosure) functions. The
    December 2025 Trump state preemption EO and January 2026 DOJ AI Litigation
    Task Force created an adversarial dynamic where both pro-regulation and
    anti-regulation sides are using courts simultaneously.'
  tags:
