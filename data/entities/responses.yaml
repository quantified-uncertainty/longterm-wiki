        - Existing responsible AI governance practices largely aligned with Act
          requirements
    - name: OpenAI
      entityId: sid_1LcLlMGLbw
      position: support
      importance: high
      reason: Publicly supported the risk-based regulatory framework; CEO Sam Altman
