- id: export-controls
  stableId: sid_SpFgTz2INg
  wikiId: E136
  type: policy
  summaryPage: governance-overview
  title: US AI Chip Export Controls
  introduced: 2022-10
  policyStatus: active
  author: Bureau of Industry and Security (BIS)
  scope: Federal
  jurisdiction: United States
  provisions:
    - title: Advanced Logic Chip Restrictions
      description: A100, H100, H200 series restricted; performance thresholds 4,800
        TOPS INT8 or 300 TFLOPS FP16
      category: Hardware
    - title: Semiconductor Manufacturing Equipment
      description: EUV/DUV lithography and specialized tools for sub-10nm fabrication
        restricted
      category: Hardware
    - title: Entity List
      description: 600+ Chinese entities subject to restrictions with presumption of denial
      category: Enforcement
    - title: Extraterritorial Reach
      description: Applies to foreign-produced items with 25% US components (0% for
        most sensitive items)
      category: Scope
  stakeholders:
    - name: Netherlands (ASML)
      position: support
      importance: high
      reason: Implemented EUV and expanded DUV equipment export licensing requirements
        under US pressure; restrictions effective September 2023
      source: https://www.cnbc.com/2023/06/30/netherlands-follows-us-with-semiconductor-export-restrictions-.html
      context:
        - ASML is the sole global provider of EUV lithography machines needed
          for cutting-edge chip fabrication
        - 29% of ASML's 2023 sales went to Chinese customers, creating strong
          financial disincentive to restrict exports
        - Dutch government did not fully align with US on threshold levels —
          disagreed on setting the line at 16/14nm
        - Delay between March 2023 announcement and September 2023 enforcement
          allowed Chinese firms to stockpile equipment
    - name: Japan (Tokyo Electron, Nikon)
      position: support
      importance: high
      reason: Aligned semiconductor equipment export controls with US after bilateral
        negotiations; restrictions effective July 2023
      context:
        - Tokyo Electron is the world's third-largest semiconductor equipment
          maker; Nikon provides DUV lithography
        - Japan's restrictions took effect July 2023, two months before Dutch
          rules
        - Coordinated via US-Japan-Netherlands trilateral negotiations since
          early 2023
    - name: Chinese AI companies
      position: oppose
      importance: high
      reason: Controls disrupted access to advanced AI training hardware; forced
        investment in domestic alternatives like Huawei's Ascend chips
      source: https://www.cfr.org/article/chinas-ai-chip-deficit-why-huawei-cant-catch-nvidia-and-us-export-controls-should-remain
      context:
        - Major Chinese cloud providers (Alibaba, Baidu, Tencent) stockpiled
          Nvidia A100/H100 chips before restrictions took effect
        - Huawei's Ascend 910B positioned as domestic alternative but
          significantly underperforms Nvidia equivalents
        - 600+ Chinese entities added to BIS Entity List with presumption of
          denial
    - name: Nvidia
      position: oppose
      importance: high
      reason: Opposed controls as harmful to US competitiveness; CEO Jensen Huang
        called export controls 'a failure' and estimated $15B in lost revenue;
        lobbied Washington extensively
      source: https://fortune.com/2025/01/13/nvidia-lashes-out-at-biden-administration-sweeping-last-minute-export-controls-on-ai-chips/
      context:
        - Created China-specific chips (A800, H800) to comply with initial
          thresholds; BIS closed loopholes in October 2023
        - China previously accounted for 20-25% of Nvidia's data center revenue;
          dropped to effectively 0%
        - Lobbying spend surged from $90K (2022) to $500K+ (2023); CEO Huang met
          with White House officials and Trump personally
        - H20 chip designed for Chinese market banned in April 2025, triggering
          $4.5B revenue impact
      entityId: sid_UvpZCnW3wA
    - name: Bureau of Industry and Security (BIS)
      position: support
      importance: high
      reason: Designed and enforced the controls; iteratively expanded restrictions in
        October 2022, October 2023, December 2024, and January 2025
      source: https://www.bis.doc.gov/index.php/policy-guidance/country-guidance/china-prc
      context:
        - Part of US Department of Commerce; primary enforcement agency for
          export controls
        - Added 140+ entities to China Entity List in December 2024 update alone
        - January 2025 AI Diffusion Rule established global performance
          thresholds for chip exports
      entityId: sid_K1hxe7b9SA
    - name: Semiconductor Industry Association (SIA)
      position: mixed
      importance: medium
      reason: Supported national security goals but warned overly broad controls could
        harm US chip industry competitiveness and push customers to foreign
        alternatives
      context:
        - Trade association representing 99% of US semiconductor industry by
          revenue
        - Members include Nvidia, Intel, AMD, Qualcomm — companies directly
          affected by revenue losses
        - Advocated for narrower, more targeted controls rather than broad
          technology restrictions
      entityId: sid_ezdMt069kA
  amendments:
    - date: October 2023
      description: First expansion; lower thresholds; A800/H800 banned
    - date: December 2024
      description: Major update; 140+ entity additions; HBM controls
    - date: January 2025
      description: AI Diffusion Rule; global performance thresholds
