- id: canada-aida
  stableId: sid_pxSyZBoBpA
  wikiId: E49
  type: policy
  summaryPage: governance-overview
  title: Artificial Intelligence and Data Act (AIDA)
  introduced: 2022-06-16
  policyStatus: failed
  author: Canadian federal government
  scope: National
  billNumber: Bill C-27, Part 3
  jurisdiction: Canada
  provisions:
    - title: High-Impact AI Risk Assessment
      description: Pre-deployment risk assessment for AI systems affecting employment,
        access to services, health/safety, economic interests
      category: Risk management
    - title: Mitigation Requirements
      description: Document potential harms; implement safeguards; establish human
        oversight; monitor performance
      category: Oversight
    - title: Transparency Obligations
      description: Plain-language system descriptions; user notification requirements
      category: Transparency
  customFields:
    - label: Introduced
      value: June 2022 (as part of Bill C-27)
    - label: Current Status
      value: Died with Parliament dissolution (January 2025)
    - label: Approach
      value: Risk-based, principles-focused
  stakeholders:
    - name: Government of Canada (ISED)
      position: support
      importance: high
      reason: Introduced AIDA as Part 3 of Bill C-27; proposed amendments in November
        2023 to address criticisms but failed to satisfy opponents
      source: https://ised-isde.canada.ca/site/innovation-better-canada/en/artificial-intelligence-and-data-act-aida-companion-document
      context:
        - Innovation, Science and Economic Development Canada (ISED) would have
          been both regulator and enforcer — a conflict of interest flagged by
          critics
        - 137 witnesses appeared before the INDU committee; 113 briefs submitted
          during study
        - November 2023 amendments added specificity but were seen as
          insufficient by civil society
    - name: Civil society coalition (45 organizations)
      position: oppose
      importance: high
      reason: Coalition of 45 civil society organizations, experts, and academics
        called for AIDA to be removed from Bill C-27 and considered separately;
        argued requirements were vague and insufficient
      source: https://montrealethics.ai/the-death-of-canadas-artificial-intelligence-and-data-act-what-happened-and-whats-next-for-ai-regulation-in-canada/
      context:
        - September 2023 letter argued shoehorning AI regulation into a privacy
          bill prevented adequate scrutiny
        - Concerned about ISED's dual role as economic development body and AI
          regulator
        - Criticized vague definitions of 'high-impact' AI systems and weak
          enforcement mechanisms
    - name: CIGI (Centre for International Governance Innovation)
      entityId: sid_CyKa5eLcCl
      position: oppose
      importance: medium
      reason: Published analysis arguing proposed amendments 'do little to mitigate AI
        harms'; called for stronger, standalone AI legislation
      source: https://www.cigionline.org/articles/proposed-changes-to-canadas-bill-c-27-do-little-to-mitigate-ai-harms/
      context:
        - Canadian think tank specializing in technology governance
        - Argued AIDA's principles-based approach lacked concrete enforcement
          teeth
    - name: International Civil Liberties Monitoring Group
      position: oppose
      importance: medium
      reason: Argued Canadians deserve protection from AI overreach but that AIDA was
        'not up to the task'; criticized the lack of robust rights protections
      source: https://iclmg.ca/aida-not-up-to-task/
      context:
        - Coalition of 45 member organizations focused on civil liberties in
          Canada
        - Called for fundamental rights impact assessments and stronger
          transparency obligations
  description: The Artificial Intelligence and Data Act (AIDA) was Canada's
    proposed federal AI legislation, introduced as Part 3 of Bill C-27 (the
    Digital Charter Implementation Act, 2022). Despite years of debate and
    amendment, the bill died on the order paper when Parliament was dissolved in
    January 2025.
  lastUpdated: 2025-12
