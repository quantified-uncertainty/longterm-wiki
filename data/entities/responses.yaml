- id: california-sb53
  stableId: sid_UD11PlWtlg
  wikiId: E457
  type: policy
  title: California SB 53
  introduced: "2025"
  policyStatus: enacted
  author: Senator Scott Wiener
  scope: State
  billNumber: SB 53
  jurisdiction: California
  provisions:
    - title: Large Frontier Developer Definition
      description: Annual revenue >$500M; models trained with >10^26 FLOPs
      category: Scope
    - title: Public Safety Frameworks
      description: Required annually on company websites; incorporate NIST AI RMF and
        industry best practices
      category: Transparency
    - title: Critical Safety Incident Reporting
      description: 15 days standard, 24 hours for imminent danger to California Office
        of Emergency Services
      category: Accountability
    - title: Whistleblower Protections
      description: Anonymous internal reporting; civil penalties for retaliation;
        attorney fees recovery
      category: Worker protections
    - title: CalCompute Consortium
      description: 14-member consortium developing state-owned public computing
        cluster for AI research/startups
      category: Infrastructure
  stakeholders:
    - name: Governor Gavin Newsom
      entityId: sid_tDwxa07Urw
      position: support
      importance: high
      reason: Signed SB 53 into law September 29, 2025, framing it as the balanced
        alternative after vetoing the more ambitious SB 1047 a year earlier
      source: https://www.gov.ca.gov/2025/09/29/governor-newsom-signs-sb-53-advancing-californias-world-leading-artificial-intelligence-industry/
      context:
        - His SB 1047 veto directly shaped SB 53's narrower scope — transparency
          over liability
        - Signed 17 other AI bills alongside SB 53, signaling preference for
          targeted regulation
        - Appointed expert panel including Fei-Fei Li to draft alternative
          approach after SB 1047 veto
    - name: Anthropic
      entityId: sid_mK9pX3rQ7n
      position: support
      importance: high
      reason: First major AI company to publicly endorse SB 53 (Sep 2025), breaking
        the united industry opposition front; stated transparency approach
        balances safety with innovation
      source: https://www.anthropic.com/news/anthropic-is-endorsing-sb-53
      context:
        - Had shifted from oppose to mixed on SB 1047 — SB 53's lighter approach
