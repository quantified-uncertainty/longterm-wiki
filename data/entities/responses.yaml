  description: Government-run institutions dedicated to evaluating frontier AI
    systems for dangerous capabilities and safety properties. Pioneered by the
    UK AISI in 2023, with analogues in the US (USAISI), EU, Japan, and others.
    Play a key role in pre-deployment evaluations and responsible scaling policy
    thresholds.
  stakeholders:
    - name: UK Government
      position: support
      importance: high
      reason: Pioneered the first AI Safety Institute in 2023; hosts the international
        AISI network secretariat
    - name: US Government (NIST)
      entityId: sid_Eac7pHF06Q
      position: support
      importance: high
      reason: Established USAISI within NIST to conduct pre-deployment evaluations of
        frontier AI systems
    - name: Frontier AI companies (Anthropic, OpenAI, Google DeepMind)
      position: support
      importance: high
      reason: Voluntarily cooperate with AISIs on pre-deployment evaluations and share
        model access for safety testing
    - name: China
      position: mixed
      importance: medium
      reason: Pursues its own parallel AI safety evaluation approach through domestic
        institutions rather than joining the international AISI network
