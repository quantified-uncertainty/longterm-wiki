- id: ai-forecasting
  stableId: sid_RW4LTglM1Q
  wikiId: E9
  type: approach
  title: AI-Augmented Forecasting
  customFields:
    - label: Maturity
      value: Rapidly emerging
    - label: Key Strength
      value: Combines AI scale with human judgment
    - label: Key Challenge
      value: Calibration across domains
    - label: Key Players
      value: Metaculus, FutureSearch, Epoch AI
  description: >
    AI-augmented forecasting combines the pattern-recognition and
    data-processing capabilities of AI systems with the contextual judgment and
    calibration of human forecasters. This hybrid approach aims to produce more
    accurate predictions about future events than either humans or AI alone,
    particularly for questions relevant to policy and risk assessment.


    Current systems take several forms. AI can aggregate and weight forecasts
    from many human predictors, adjusting for individual track records and
    biases. AI can assist forecasters by synthesizing relevant information,
    identifying base rates, and flagging considerations that might otherwise be
    missed. More ambitiously, AI systems can generate their own forecasts that
    human superforecasters then evaluate and combine with their own judgments.


    For AI safety and epistemic security, improved forecasting offers several
    benefits. Better predictions about AI capabilities help with governance
    timing. Forecasting AI-related risks provides early warning. Publicly
    visible forecasts create accountability for claims about AI development. The
    key challenge is calibration - ensuring that probability estimates are
    meaningful across diverse domains and maintaining accuracy as AI systems
    become the subject of the forecasts themselves.
  tags:
    - forecasting
    - prediction-markets
    - ai-capabilities
    - decision-making
    - calibration
  lastUpdated: 2025-12
- id: content-authentication
  stableId: sid_pZOVjv0Bng
  wikiId: E74
  type: approach
  title: AI Content Authentication
  customFields:
    - label: Maturity
      value: Standards emerging; early deployment
    - label: Key Standard
      value: C2PA (Coalition for Content Provenance and Authenticity)
    - label: Key Challenge
      value: Universal adoption; credential stripping
    - label: Key Players
      value: Adobe, Microsoft, Google, BBC, camera manufacturers
  relatedEntries:
    - id: sid_GvV1xPNXRw
      type: risk
    - id: sid_MUGUxfl2YA
      type: risk
    - id: sid_AaAOkTHkug
      type: risk
    - id: sid_GnUTRJhA4g
      type: risk
  description: >
    Content authentication technologies aim to establish verifiable provenance
    for digital content - allowing users to confirm where content came from,
    whether it has been modified, and whether it was created by AI or humans.
    The goal is to rebuild trust in digital media by creating technical
    guarantees of authenticity that complement human judgment.


    The leading approach is the C2PA (Coalition for Content Provenance and
    Authenticity) standard, backed by major technology companies. C2PA embeds
    cryptographically signed metadata into content at the point of creation -
    when a photo is taken, when a video is recorded, when an AI generates an
    image. This creates a chain of custody that can be verified later. Other
    approaches include invisible watermarking (SynthID), blockchain-based
    verification, and forensic analysis tools that detect signs of synthetic
    generation or manipulation.


    The key challenges are adoption and circumvention. Content authentication
    only works if it becomes universal - if users come to expect provenance
    information and distrust content without it. But metadata can be stripped,
    watermarks can potentially be removed or spoofed, and AI-generated content
    without credentials can still circulate. The race between authentication and
    forgery capability is uncertain, but authentication provides one of the few
    technical defenses against the coming flood of synthetic content.
  tags:
    - deepfakes
    - digital-evidence
    - verification
    - watermarking
    - trust
  lastUpdated: 2025-12
- id: coordination-tech
  stableId: sid_DnYQRsR1pw
  wikiId: E77
  type: approach
  title: AI Governance Coordination Technologies
  customFields:
    - label: Maturity
      value: Emerging; active development
    - label: Key Strength
      value: Addresses collective action failures
    - label: Key Challenge
      value: Bootstrapping trust and adoption
    - label: Key Domains
      value: AI governance, epistemic defense, international cooperation
  relatedEntries:
    - id: sid_SUZgWeZLNA
