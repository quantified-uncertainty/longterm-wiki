      source: https://about.fb.com/news/2023/06/how-ai-regulation-can-work-for-everyone/
      context:
        - Open-source AI strategy (Llama models) most affected by GPAI
          transparency and documentation obligations
        - Co-founded AI Alliance with IBM — lobbying vehicle against
          prescriptive GPAI rules
        - Open-source models with open weights exempt from most GPAI Tier 1
          requirements except copyright compliance
    - name: Microsoft
      entityId: sid_OIY5gaPpBA
      position: support
      importance: high
      reason: Supported risk-based approach; President Brad Smith called the EU AI Act
