    - id: sid_TaBC4uj0Bw
      type: risk
    - id: sid_IK5egiQE9w
      type: risk
    - id: sid_jiqdwTucCA
      type: risk
  description: >
    Epistemic infrastructure refers to the foundational systems that societies
    depend on for creating, verifying, preserving, and accessing knowledge. Just
    as physical infrastructure (roads, power grids) underlies economic activity,
    epistemic infrastructure (archives, scientific publishing, fact-checking
    networks, educational institutions) underlies society's capacity to know
    things collectively. This infrastructure is under stress and requires
    deliberate investment.


    Current epistemic infrastructure includes elements like Wikipedia (the
    largest attempt at collaborative knowledge creation), the Internet Archive
    (preserving digital history), academic peer review (verifying scientific
    claims), journalism (investigating and reporting events), and educational
    systems (transmitting knowledge across generations). Each of these faces
    AI-related threats: Wikipedia can be corrupted with AI-generated
    misinformation, archives struggle to authenticate materials, peer review
    cannot keep pace with AI-generated fraud, and journalism is economically
    threatened.


    Strengthening epistemic infrastructure requires treating it as a public good
    deserving of investment. This might include: funding for fact-checking
    organizations and investigative journalism, technical infrastructure for
    content authentication, archives designed for an AI-generated-content world,
    AI systems explicitly designed to support human knowledge creation rather
    than replace it, and educational programs that teach critical evaluation in
    an AI context. The alternative - letting epistemic infrastructure decay
    while AI advances - leads to knowledge monopolies, trust collapse, and
    reality fragmentation.
  tags:
    - knowledge-management
    - public-goods
    - information-infrastructure
    - verification
    - ai-for-good
  lastUpdated: 2025-12
- id: hybrid-systems
  stableId: sid_nvE06LwtpQ
  wikiId: E161
  type: approach
  title: AI-Human Hybrid Systems
  customFields:
    - label: Maturity
      value: Emerging field; active research
    - label: Key Strength
      value: Combines AI scale with human robustness
    - label: Key Challenge
      value: Avoiding the worst of both
    - label: Related Fields
      value: HITL, human-computer interaction, AI safety
  relatedEntries:
    - id: sid_72cwRMbzMA
      type: risk
    - id: sid_54ItAwh4QA
      type: risk
    - id: sid_13OO6CP98g
      type: risk
    - id: sid_SFFrl4Pmag
      type: risk
    - id: sid_ks0lqvZqUg
      type: risk
  description: >
    AI-human hybrid systems are designs that deliberately combine AI
    capabilities with human judgment to achieve outcomes better than either
    could produce alone. Rather than full automation or human-only processes,
    hybrid systems aim to capture the benefits of AI (scale, speed, consistency,
    pattern recognition) while preserving the benefits of human judgment
    (contextual understanding, values, robustness to novel situations).


    Effective hybrid systems require careful design to avoid the pathologies of
    both pure automation and nominal human oversight. Automation bias leads
    humans to defer to AI even when AI is wrong. Rubber-stamp oversight gives an
    illusion of human control without substance. The challenge is creating
    systems where humans genuinely contribute and AI genuinely assists, rather
    than one side dominating or the partnership failing.


    Examples of promising hybrid approaches include: AI systems that flag
    decisions for human review based on uncertainty or stakes, rather than
    automating all decisions; human-in-the-loop systems where AI drafts and
    humans edit; collaborative intelligence systems where AI and humans have
    complementary roles; and AI tutoring systems that guide rather than replace
    learning. For AI safety, hybrid systems represent a middle ground between
    naive confidence in human oversight and resignation to full AI autonomy.
  tags:
    - human-ai-interaction
    - ai-control
    - decision-making
    - automation-bias
    - ai-safety
