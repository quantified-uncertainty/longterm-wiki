    - title: Compute Threshold Reporting
      description: >-
        Companies training models using >10^26 FLOP (general dual-use) or >10^23 FLOP (biological sequence)
        must notify Commerce Department before and during training, share safety testing results. Same 10^26
        threshold later adopted by SB 1047.
      category: Reporting
    - title: Safety Testing & Red-Teaming
      description: >-
        Developers of dual-use foundation models must conduct red-team testing for CBRN capabilities,
        cybersecurity vulnerabilities, and societal risks before deployment.
      category: Pre-deployment
    - title: AI Safety Institute Creation
      description: >-
        Established AISI within NIST to develop evaluation methodologies, conduct safety assessments of
        frontier models, and coordinate with international partners.
