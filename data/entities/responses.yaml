- id: new-york-raise-act
  stableId: qHOO4Xb9dA
  wikiId: E471
  type: policy
  summaryPage: governance-overview
  title: New York RAISE Act
  introduced: '2025-03'
  policyStatus: enacted
  author: Senator Andrew Gounardes, Assemblymember Alex Bores
  scope: State
  billNumber: S6953B / A6453B
  jurisdiction: New York
  provisions:
    - title: Frontier Model Coverage
      description: Applies to models trained with >10^26 FLOPs by developers with >$500M annual revenue
      category: Scope
    - title: Safety Protocols
      description: Risk identification and mitigation for critical harm (death/serious injury to 100+ people, >$1B damage, WMD assistance); required before training and deployment
      category: Safety
    - title: Incident Reporting
      description: Report safety incidents within 72 hours to AG and Division of Homeland Security
      category: Accountability
    - title: Whistleblower Protections
      description: Anonymous internal reporting; protections for contractors and employees; civil penalties for retaliation
      category: Worker protections
    - title: DFS Oversight Office
      description: Department of Financial Services to establish an office overseeing AI frontier model compliance
      category: Oversight
    - title: Penalties
      description: Civil penalties up to $1M per violation and $3M for willful violations, reduced from original $10M/$30M via chapter amendments
      category: Enforcement
    - title: Registration Requirement
      description: Frontier model developers must register with the state before operating
      category: Transparency
    - title: Third-Party Audits
      description: Independent annual audits to verify compliance and assess risk mitigation
      category: Oversight
  stakeholders:
    - name: Governor Kathy Hochul
      position: support
      reason: Signed into law December 19, 2025; called it nation-leading legislation
