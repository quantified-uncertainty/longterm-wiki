  description: The Colorado AI Act (SB 24-205) is the first comprehensive AI
    regulation enacted by a US state, taking a risk-based approach to regulating
    high-risk AI systems — in contrast to California's SB 1047 which used a
    size-based threshold for frontier models. Introduced April 10, 2024 by
    Senator Robert Rodriguez and signed by Governor Jared Polis on May 17, 2024,
    the law covers AI systems making consequential decisions across eight
    domains including employment, healthcare, and lending. Polis signed with a
    public letter expressing concerns that the law was too broad and could
    stifle innovation. Enforcement was originally set for February 1, 2026 but
    was delayed to June 30, 2026 after tech industry lobbying during an August
    2025 special session (SB 25B-004). The Colorado Attorney General has
    exclusive enforcement authority with penalties up to $20,000 per violation.
    President Trump's February 2025 executive order challenging state AI
    regulations adds uncertainty to the law's implementation.
