- id: ai-governance-research
  stableId: sid_jjCh8xw39l
  type: approach
  title: AI Governance Research and Analysis
  description: "Academic and think tank research informing AI policy development.
    Ranges from technical governance (compute governance, hardware-enabled
    mechanisms) to political-institutional analysis (state capacity, regulatory
    design) to rights-based frameworks (algorithmic accountability, AI and human
    rights). Key institutions by focus: Technical governance — GovAI (compute
    governance, international strategy), IAPS (frontier security, fellowship
    pipeline). Rights and accountability — AI Now Institute (power
    concentration, annual landscape reports), AlgorithmWatch (algorithmic
    accountability journalism, EU focus), Algorithmic Justice League (bias
    auditing, TSA facial recognition). Policy design — Brennan Center (AI
    legislation tracking across all states, democracy and AI agenda), Brookings
    AI (most-cited DC think tank on AI policy), RAND (defense and national
    security AI), Carnegie AI (international affairs and AI geopolitics),
    Stanford HAI (AI Index, 200+ affiliated faculty). CDT bridges research and
    advocacy via its AI Governance Lab. Research effectiveness depends on
    translation to policy — GovAI and Brennan Center have among the highest
    cited-by-policymakers ratios in the field."
