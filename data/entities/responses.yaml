      description: Standards and tools for authenticating AI-generated content through watermarking, labeling, and content provenance.
      category: Transparency
    - title: Cloud Compute KYC Requirements
      description: >-
        IaaS providers must verify identity of foreign customers, monitor large training runs, and report
        to Commerce when foreign customers train large AI models.
      category: Enforcement
    - title: Federal Agency AI Standards
      description: Each agency must designate a Chief AI Officer; OMB guidance on rights-impacting and safety-impacting AI use.
      category: Government modernization
    - title: AI Talent Immigration
      description: Streamlined visa processing for AI researchers; modernized O-1A, EB-1A, EB-2 pathways.
      category: Immigration
    - title: NIST AI Safety Standards
      description: Directed NIST to develop standards and best practices for AI safety and security, building on the AI Risk Management Framework.
