- id: us-executive-order
  stableId: sid_pz3KSt33AA
  wikiId: E366
  type: policy
  summaryPage: governance-overview
  title: US Executive Order on Safe, Secure, and Trustworthy AI
  introduced: 2023-10-30
  policyStatus: revoked
  author: President Biden
  scope: Federal
  billNumber: EO 14110
  jurisdiction: United States
  fullTextUrl: https://www.whitehouse.gov/briefing-room/presidential-actions/2023/10/30/executive-order-on-the-safe-secure-and-trustworthy-development-and-use-of-artificial-intelligence/
  provisions:
    - title: Compute Threshold Reporting
      description: Companies training models using >10^26 FLOP (general dual-use) or
        >10^23 FLOP (biological sequence) must notify Commerce Department before
        and during training, share safety testing results. Same 10^26 threshold
        later adopted by SB 1047.
      category: Reporting
    - title: Safety Testing & Red-Teaming
      description: Developers of dual-use foundation models must conduct red-team
        testing for CBRN capabilities, cybersecurity vulnerabilities, and
        societal risks before deployment.
      category: Pre-deployment
    - title: AI Safety Institute Creation
      description: Established AISI within NIST to develop evaluation methodologies,
        conduct safety assessments of frontier models, and coordinate with
        international partners.
      category: Institutional
    - title: AI-Generated Content Watermarking
      description: Standards and tools for authenticating AI-generated content through
        watermarking, labeling, and content provenance.
      category: Transparency
    - title: Cloud Compute KYC Requirements
      description: IaaS providers must verify identity of foreign customers, monitor
        large training runs, and report to Commerce when foreign customers train
        large AI models.
      category: Enforcement
    - title: Federal Agency AI Standards
      description: Each agency must designate a Chief AI Officer; OMB guidance on
        rights-impacting and safety-impacting AI use.
      category: Government modernization
    - title: AI Talent Immigration
      description: Streamlined visa processing for AI researchers; modernized O-1A,
        EB-1A, EB-2 pathways.
      category: Immigration
    - title: NIST AI Safety Standards
      description: Directed NIST to develop standards and best practices for AI safety
        and security, building on the AI Risk Management Framework.
      category: Standards
  stakeholders:
    - name: Biden Administration
      entityId: sid_6kAEE9sPCg
      position: support
      importance: high
      reason: Authored and signed the order on October 30, 2023; framed as essential
        for safe AI development and national security; implemented ~85% of 150
        requirements before revocation
      source: https://www.whitehouse.gov/briefing-room/statements-releases/2023/10/30/fact-sheet-president-biden-issues-executive-order-on-safe-secure-and-trustworthy-artificial-intelligence/
      context:
        - 111-page directive placing 150+ requirements on 50+ federal entities
        - Commerce Secretary Gina Raimondo led implementation including AISI
          creation
        - Secured voluntary commitments from 15 AI companies in July 2023 as a
          precursor
    - name: OpenAI
      entityId: sid_1LcLlMGLbw
      position: support
      importance: high
      reason: Signed voluntary pre-deployment testing agreement with AISI (Aug 2024);
