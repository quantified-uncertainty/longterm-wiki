      source: https://leg.colorado.gov/bills/sb24-205
      context:
        - Major AI deployer (Copilot, Azure AI) with products spanning all eight
          covered high-risk domains
        - Invested $13B in OpenAI; supports regulation that aligns with its
          existing responsible AI practices
        - Active lobbyist during August 2025 special session alongside 150+
          other industry lobbyists
    - name: IBM
      entityId: sid_9N0hqjccSg
      position: support
      importance: medium
      reason: Endorsed the risk-based regulatory approach as a model for state-level
        AI governance; aligned with IBM's own AI ethics framework
      source: https://www.iapp.org/news/a/colorado-ai-act-key-provisions-and-compliance-implications/
      context:
