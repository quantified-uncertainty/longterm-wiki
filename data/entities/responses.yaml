  type: project
  title: FlexHEG (Flexible Hardware-Enabled Guarantees)
  projectStatus: active
  projectUrl: https://yoshuabengio.org/wp-content/uploads/2024/09/FlexHEG-Interim-Report_2024.pdf
  startDate: 2024-09
  description: Research project led by Yoshua Bengio developing open-source
    hardware-enabled guarantees for AI governance. Proposes a "Guarantee
    Processor" that monitors accelerator usage and verifies compliance, combined
    with a "Secure Enclosure" providing physical tamper protection. Funded with
    $4.1M from the Survival and Flourishing Fund (2024). Published interim
    report (September 2024), technical options paper (arXiv:2506.03409), and
    international security applications paper (arXiv:2506.15100).
    Interlock-based design gives the Guarantee Processor direct access to the
    accelerator data path. Estimated 3.7-7.9 years for integrated hardware
    deployment.
