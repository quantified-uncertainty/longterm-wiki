- id: texas-traiga
  stableId: sid_561xbhJAeQ
  wikiId: E602
  type: policy
  title: Texas Responsible AI Governance Act (TRAIGA)
  introduced: 2024-12
  policyStatus: enacted
  author: Representative Giovanni Capriglione
  scope: State
  billNumber: HB 149
  jurisdiction: Texas
  provisions:
    - title: Prohibited AI Practices
      description: Intent-based liability for harmful AI uses including behavioral
        manipulation, constitutional rights violations, unlawful discrimination
      category: Enforcement
    - title: Government Disclosure Requirements
      description: Clear notice before interaction with government AI; plain language;
        no dark patterns
      category: Transparency
    - title: AI Advisory Council
      description: 7-member council appointed by governor/lt. governor/speaker;
        ethical AI oversight (advisory only)
      category: Governance
    - title: Regulatory Sandbox
      description: 36-month program allowing testing of AI systems with waivers of
        certain laws
      category: Innovation
  stakeholders:
    - name: Governor Greg Abbott
      entityId: sid_meOi3DfVbJ
      position: support
      importance: high
      reason: Signed HB 149 into law on June 22, 2025; positioned Texas as a model for
        pro-innovation AI regulation
      source: https://iapp.org/news/a/governor-signs-texas-responsible-artificial-intelligence-governance-act
      context:
        - Signed alongside broader Texas tech-friendly legislative agenda
        - Texas hosts 1,500+ tech firms and 17% of US AI startups — significant
          business constituency
    - name: Rep. Giovanni Capriglione
      entityId: sid_b4G8eurPFD
      position: support
      importance: high
      reason: Primary author; spent two years gathering stakeholder input from
        hundreds of groups to develop the intent-based regulatory approach
      source: https://www.texaspolicy.com/press/tppf-celebrates-passage-of-hb-149-out-of-the-texas-house-of-representatives
      context:
        - Filed original TRAIGA concept on December 23, 2024; HB 149 filed March
          14, 2025
        - Worked closely with Texas Public Policy Foundation to convene
          stakeholders
        - Chose intent-based liability approach rather than comprehensive
          compliance requirements
    - name: Texas Public Policy Foundation
      entityId: sid_WHAEpX4KJm
      position: support
      importance: high
      reason: Collaborated with Rep. Capriglione to convene stakeholders; TPPF
        director David Dunmoyer called it 'the culmination of years of work
        committed to securing Texas as the nationwide model for AI policy'
      source: https://www.texaspolicy.com/press/tppf-celebrates-passage-of-hb-149-out-of-the-texas-house-of-representatives
      context:
        - Conservative think tank that helped shape the bill's light-touch
          regulatory approach
        - Frames TRAIGA as a contrast to California and New York's more
          prescriptive AI laws
        - David Dunmoyer (Director for Better Tech for Tomorrow) was lead policy
          advocate
    - name: Tech industry
      position: support
      importance: medium
      reason: Preferred simplified intent-based approach over comprehensive compliance
        requirements; regulatory sandbox provision attractive for AI companies
      source: https://www.biometricupdate.com/202506/texas-charts-independent-path-on-ai-regulation-awaits-governors-okay
      context:
        - Near-unanimous legislative passage (House 146-3, Senate unanimous)
          reflected broad industry support
        - 36-month regulatory sandbox allows testing AI systems with waivers of
          certain laws
        - Intent-based liability seen as lower compliance burden than risk-based
          approaches (Colorado) or safety protocol mandates (New York)
    - name: R Street Institute coalition
      position: oppose
      importance: medium
      reason: Coalition of free-market groups argued TRAIGA imposes restrictive
        regulations and burdensome compliance costs that risk stifling
        innovation despite its light-touch framing
      source: https://www.rstreet.org/outreach/coalition-urges-texas-lawmakers-against-heavy-handed-regulation-of-ai/
      context:
        - Joined by Americans for Tax Reform and other anti-regulation
          organizations
        - Argued compliance mandates particularly hurt small businesses lacking
          resources of larger tech firms
        - Opposed any state-level AI regulation, not just TRAIGA specifically
      entityId: sid_yfAYuNTKxQ
    - name: Transparency Coalition
      position: mixed
      importance: low
      reason: Raised concerns about the law's effectiveness while acknowledging its
        scope; published detailed analysis noting TRAIGA's approach hinges on
        paperwork rather than accountability
      source: https://www.transparencycoalition.ai/news/faq-for-texas-traiga-skeptics-hard-questions-answered-here
      context:
        - Published FAQ addressing common skeptic concerns about the bill
        - Questioned whether the Attorney General has resources to meaningfully
          enforce compliance
  votes:
    - chamber: House
      date: April 23, 2025
      result: Passed
      ayes: 146
      noes: 3
    - chamber: Senate
      date: May 23, 2025
      result: Passed
  description: Texas TRAIGA is a state-level AI regulation focused on intent-based
    liability for harmful AI practices rather than comprehensive safety
    requirements. Passed with near-unanimous support (House 146-3, Senate
    unanimous). Creates enforcement mechanisms and a regulatory sandbox but
