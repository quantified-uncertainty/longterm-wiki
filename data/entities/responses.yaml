    - id: sid_FAvAr2lvzg
      type: risk
    - id: sid_0t2GLN0sBA
      type: risk
    - id: sid_Pr5xmThNfA
      type: risk
  description: >
    Coordination technologies are tools and mechanisms that enable actors to
    cooperate on collective challenges when individual incentives favor
    defection. For AI safety, these technologies address the fundamental problem
    that racing to develop AI faster may be individually rational but
    collectively catastrophic. For epistemic security, they help coordinate
    defensive responses to disinformation.


    These technologies draw on mechanism design, game theory, and institutional
    economics. Examples include: verification protocols that allow actors to
    confirm others' compliance with agreements (critical for AI safety
    treaties); commitment devices that make defection from cooperative
    arrangements costly; signaling mechanisms that allow actors to credibly
    communicate intentions; and platforms that make coordination focal points
    more visible.


    For AI governance specifically, coordination technologies might include
    compute monitoring systems that verify compliance with training
    restrictions, international registries of advanced AI systems, and
    mechanisms for sharing safety research while protecting commercial
    interests. The fundamental insight from Elinor Ostrom's work is that
    collective action problems are not unsolvable - but they require deliberate
    institutional design. The urgency of AI risk makes developing effective
    coordination mechanisms for this domain a priority.
  tags:
    - game-theory
    - governance
    - international-cooperation
    - mechanism-design
    - verification
  lastUpdated: 2025-12
- id: deliberation
  stableId: sid_3a66Dwt6xg
  wikiId: E100
  type: approach
  title: AI-Assisted Deliberation
  customFields:
    - label: Maturity
      value: Emerging; promising pilots
    - label: Key Strength
      value: Scales genuine dialogue, not just voting
    - label: Key Challenge
      value: Adoption and integration with governance
    - label: Key Players
      value: Polis, Anthropic (Collective Constitutional AI), Taiwan vTaiwan
  description: >
    AI-assisted deliberation uses AI to scale meaningful democratic dialogue
    beyond the constraints of traditional town halls and focus groups. Rather
    than replacing human deliberation with AI decisions, these tools use AI to
    facilitate, synthesize, and scale genuine human discussion - enabling
    thousands or millions of people to engage in deliberative processes that
    traditionally require small groups.


    Pioneering systems like Polis cluster participant opinions to surface areas
    of consensus and reveal the structure of disagreement. Taiwan's vTaiwan
    platform has used these tools to engage citizens in policy development on
    contentious issues. Anthropic's Collective Constitutional AI experiment used
    similar methods to gather public input on how AI systems should behave. The
    core insight is that AI can help identify common ground, summarize diverse
    viewpoints, and translate between different perspectives at scales
    previously impossible.


    For AI governance, these tools offer a path to democratically legitimate AI
    policy. Rather than leaving AI development decisions to companies or
    technical elites, deliberation platforms could engage broader publics in
    decisions about how AI should be developed and deployed. For epistemic
    security, deliberative processes can help societies navigate contested
    questions by surfacing genuine consensus where it exists and clarifying the
    structure of genuine disagreement where it doesn't.
  tags:
    - democratic-innovation
    - collective-intelligence
    - governance
    - participatory-democracy
    - consensus-building
  lastUpdated: 2025-12
- id: epistemic-infrastructure
  stableId: sid_pkCwkyxL0w
  wikiId: E122
  type: approach
  title: AI-Era Epistemic Infrastructure
  customFields:
    - label: Maturity
      value: Conceptual; partial implementations
    - label: Key Insight
      value: Knowledge systems need deliberate design
    - label: Key Challenge
      value: Coordination, funding, governance
    - label: Key Examples
      value: Wikipedia, Semantic Scholar, fact-checking networks
  relatedEntries:
    - id: sid_1NWLygwzGw
      type: risk
    - id: sid_GeYirWJrwA
