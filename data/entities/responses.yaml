      position: oppose
      importance: medium
      reason: Published economic impact study estimating the act could cost Colorado
        approximately 40,000 jobs due to compliance burdens on businesses
      source: https://commonsenseinstituteco.org/colorado-artificial-intelligence-act/
      context:
        - Colorado-based free-market think tank; study widely cited by industry
          opponents during special session
        - Job loss estimate contested by act supporters as based on speculative
          assumptions
    - name: US Chamber of Commerce
      entityId: sid_cQQdrABVv0
      position: oppose
      importance: medium
      reason: Argued the law may hamper small business AI adoption; preferred a
        gap-filling approach over the broad application to all high-risk AI
        systems
      context:
        - Largest US business advocacy organization; lobbied alongside
          state-level industry groups
        - Advocated for strengthening existing consumer protection and civil
          rights laws instead
