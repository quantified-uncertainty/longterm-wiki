- id: chip-security-act
  stableId: sid_A9qQJtpTCA
  wikiId: E2085
  type: policy
  title: Chip Security Act
  introduced: 2025-05-08
  policyStatus: proposed
  scope: Federal
  billNumber: H.R.3447 / S.1705
  jurisdiction: United States
  session: 119th Congress
  fullTextUrl: https://www.congress.gov/bill/119th-congress/house-bill/3447/text
  description: Bipartisan legislation mandating location verification and security
    mechanisms on export-controlled AI chips. Requires the Secretary of Commerce
    to issue standards for "chip security mechanisms" within 180 days of
    enactment. Uses ping-based delay measurement (not GPS) to verify chip
    locations. Companies must notify BIS if chips are found in unauthorized
    locations. Explicitly prohibits kill switches and geofencing that would
    hinder chip functionality. Motivated by an estimated 140,000 chips worth
    $5-7 billion smuggled to China in 2024.
  provisions:
    - title: Location Verification Mandate
      description: Requires chip security mechanisms implementing location
        verification using "feasible and appropriate" techniques on covered
        chips (ECCN 3A090, 3A001.z, 4A090, 4A003.z) within 180 days of
        enactment.
      category: Hardware
    - title: Unauthorized Location Reporting
      description: Companies must notify BIS upon discovering "credible information"
        that a chip is in an unauthorized location or has been tampered with to
        disable or spoof security mechanisms.
      category: Enforcement
    - title: Kill Switch Prohibition
      description: Explicitly prohibits "any chip security mechanisms that may hinder
        the capability or functionality of a covered integrated circuit product,
        such as a kill switch or geofencing mechanism."
      category: Limitations
    - title: Additional Mechanism Assessment
      description: Requires DoC (and DoD in Senate version) to assess whether
        additional mechanisms are needed to verify chip workload or modify
        functionality.
      category: Future Scope
  stakeholders:
    - name: Sen. Tom Cotton
      entityId: sid_kGi3RooJe8
      position: support
      role: Primary Senate sponsor
      importance: high
    - name: Sen. Elizabeth Warren
      entityId: sid_OyPBrUIpeS
      position: support
      role: Senate cosponsor
      importance: high
    - name: Rep. Bill Huizenga
      entityId: sid_cYPfKeUa36
      position: support
      role: Primary House sponsor
      importance: high
    - name: Semiconductor Industry Association
      position: oppose
      importance: high
      reason: Cannot support "blanket mandates for new, untested, and potentially
        infeasible on-chip mechanisms"; warns of undermining global trust in
        American semiconductor technologies.
      entityId: sid_ezdMt069kA
