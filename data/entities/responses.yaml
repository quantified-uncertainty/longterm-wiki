  jurisdiction: United States
  session: 119th Congress
  fullTextUrl: https://www.congress.gov/bill/119th-congress/senate-bill/1473/text
  description: Creates a whistleblower incentive program at the Bureau of Industry
    and Security (BIS) modeled after the SEC Whistleblower Incentive Program.
    Whistleblowers receive 10-30% of collected fines for original information
    leading to penalties exceeding $1 million. Anonymous reporting permitted
    with retaliation protections. Funded via an "Export Compliance
    Accountability Fund" financed by collected fines (no new appropriations).
    Aims to deter export control violations through market-powered enforcement.
  provisions:
    - title: Whistleblower Financial Incentives
      description: Whistleblowers receive 10-30% of collected fines for original
        information leading to penalties exceeding $1 million. BIS can levy
        penalties up to 2x the transaction value.
      category: Enforcement
    - title: Anonymous Reporting Platform
      description: BIS must create a public, secure platform for submitting reports.
        60-day credibility determination deadline with status updates every 30
        days.
      category: Infrastructure
    - title: Retaliation Protections
      description: Whistleblowers receive legal protections against retaliation. Known
        terrorists, criminals, and federal employees acting within scope are
        excluded.
      category: Protections
    - title: Export Compliance Accountability Fund
      description: Self-funded program financed by collected fines. Covers
        whistleblower awards, investigation reviews, business education, and
        record-keeping. No new appropriations required.
      category: Funding
