  description: SB 1047, the Safe and Secure Innovation for Frontier Artificial
    Intelligence Models Act, was California state legislation that would have
    required safety testing and liability measures for developers of the most
    powerful AI models. Passed the legislature with strong majorities (Senate
    32-1, Assembly 48-16) but was vetoed by Governor Newsom, who cited concerns
    about regulating based on model size rather than risk.
