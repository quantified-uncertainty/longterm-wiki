- id: bletchley-declaration
  stableId: sid_X2gSvrOang
  wikiId: E469
  type: policy
  summaryPage: governance-overview
  title: Bletchley Declaration
  introduced: 2023-11-01
  policyStatus: active
  author: UK government (Rishi Sunak)
  scope: International
  jurisdiction: International
  provisions:
    - title: Shared Risk Understanding
      description: Evidence-based understanding of frontier AI safety risks including
        misuse, loss of control, catastrophic consequences
      category: Principles
    - title: Developer Responsibility
      description: Frontier AI developers bear particularly strong responsibility for
        safety through testing, evaluations, mitigation
      category: Accountability
    - title: AI Safety Institutes
      description: UK AISI established with 100M pounds; US AISI within NIST; 10+
        countries committed to institutes
      category: Institutions
  stakeholders:
    - name: United Kingdom
      position: support
      importance: high
      reason: Hosted the summit at Bletchley Park; PM Rishi Sunak made AI safety a
        signature policy; established the world's first national AI Safety
        Institute
      source: https://techcrunch.com/2023/11/02/at-bletchley-rishi-sunak-confirms-ai-safety-institute-but-delays-regulations-for-another-day/
      context:
        - Tripled AI Research Resource investment to 300M pounds (up from 100M
          announced March 2023)
        - UK AISI became first national institute dedicated to evaluating
          frontier AI models
        - Sunak positioned AI safety as a post-Brexit UK leadership area in
          international policy
    - name: United States
      position: support
      importance: high
      reason: VP Kamala Harris attended and announced US commitment to establish AI
        Safety Institute within NIST; signed the declaration alongside 27 other
        countries
      source: https://carnegieendowment.org/posts/2023/11/the-uk-ai-safety-summit-opened-a-new-chapter-in-ai-diplomacy
      context:
        - US AISI established within NIST following the summit commitment
        - Biden administration had issued EO 14110 one week before the summit
          (Oct 30, 2023)
        - VP Harris used the summit to announce US AI safety commitments to
          multilateral audience
    - name: China
      position: support
      importance: high
      reason: Signed the declaration despite ongoing US-China tensions over AI chip
        export controls and broader technology competition
      source: https://www.gov.uk/government/publications/ai-safety-summit-2023-the-bletchley-declaration
      context:
        - China's participation was considered a major diplomatic achievement by
          the UK hosts
        - Vice Minister of Science and Technology Wu Zhaohui led the Chinese
          delegation
        - China had implemented its own Generative AI Interim Measures just
          three months earlier (Aug 2023)
        - Did not participate in follow-up Seoul summit's voluntary company
          commitments
    - name: European Union
      position: support
      importance: high
      reason: Commission President Ursula von der Leyen attended; positioned the EU AI
        Act as complementary to summit commitments
      source: https://www.gov.uk/government/publications/ai-safety-summit-2023-the-bletchley-declaration
      context:
        - EU AI Act was in final trilogue negotiations during the summit
          (December 2023 compromise)
        - Von der Leyen used the summit to advocate for the EU's risk-based
          regulatory approach
        - EU subsequently established its own AI Office as the institutional
          follow-up
    - name: Frontier AI companies
      position: support
      importance: high
      reason: Major AI labs including OpenAI, Google DeepMind, Anthropic, and Meta
        participated and agreed to pre-deployment safety testing
      source: https://www.gov.uk/government/publications/frontier-ai-safety-commitments-ai-seoul-summit-2024
      context:
        - Companies agreed to give UK AISI early access to frontier models for
          safety evaluation
        - Commitments were voluntary and non-binding; enforcement purely
          reputational
        - Seoul summit (May 2024) expanded to 16 company signatories with more
          specific commitments
  votes:
    - chamber: Summit
      date: November 2, 2023
      result: Signed by 28 countries + EU
  customFields:
    - label: Signed on
      value: November 2, 2023 — by 28 countries + EU
    - label: Type
