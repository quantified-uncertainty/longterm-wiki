      entityId: sid_TGWTD6b92y
      position: mixed
      importance: high
      reason: Signed the bill into law on May 17, 2024 but issued a public letter
        expressing concerns about the law being too broad and potentially
        stifling innovation; urged the legislature to revisit before enforcement
        and called for federal preemption
      source: https://www.coloradosun.com/2024/05/17/jared-polis-signs-ai-bill-sb205/
      context:
        - In signing statement, explicitly encouraged federal legislation to
          preempt this state law
        - Called an August 2025 special session partly in response to industry
          pressure to delay enforcement
        - Signed SB 25B-004 delaying enforcement from February 1 to June 30, 2026
    - name: Google
      entityId: sid_cMNszJMTPX
      position: support
      importance: medium
      reason: Applauded risk-based approach as preferable to size-based regulation
