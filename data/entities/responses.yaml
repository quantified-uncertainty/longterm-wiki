  description: California's Transparency in Frontier Artificial Intelligence Act
    (TFAIA), the first U.S. state law regulating frontier AI models. Requires
    large developers (>$500M revenue, models >10^26 FLOPs) to publish annual
    safety frameworks, report critical safety incidents within 15 days (24 hours
    for imminent danger), and protects whistleblowers. Also creates CalCompute,
    a public computing cluster for AI research. Signed September 29, 2025 by
    Governor Newsom after he vetoed the more ambitious SB 1047 a year earlier.
    Effective January 1, 2026. Civil penalties up to $1M per violation, enforced
    by the California Attorney General.
