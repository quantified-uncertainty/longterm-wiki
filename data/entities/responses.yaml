- id: eu-ai-act
  stableId: La8s84s3zg
  wikiId: E127
  type: policy
  summaryPage: governance-overview
  title: EU AI Act
  introduced: '2021-04'
  policyStatus: enacted
  author: European Commission
  scope: International
  billNumber: Regulation (EU) 2024/1689
  jurisdiction: European Union
  fullTextUrl: https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng
  description: >-
    The EU AI Act is the world's first comprehensive legal framework for artificial intelligence. Approved by the European
    Parliament in March 2024 with a 523-46-49 vote, it establishes a risk-based approach with four tiers: unacceptable
    (banned), high-risk (strict obligations), limited risk (transparency), and minimal risk (voluntary codes). The Act
    introduces a two-tier framework for general-purpose AI (GPAI) models, with enhanced requirements for models posing
    systemic risk (trained with >10^25 FLOPs). Implementation is phased: prohibitions took effect February 2025, GPAI
    rules in August 2025, and high-risk obligations apply from August 2026. Fines up to 7% of global revenue for violations.
  provisions:
    - title: Prohibited AI Practices
      description: >-
        Bans social scoring by governments, subliminal/manipulative AI techniques causing harm, exploitation of
        vulnerabilities (age, disability), untargeted scraping for facial recognition databases, emotion recognition
        in workplaces/schools, and real-time remote biometric identification in public spaces (with narrow law
        enforcement exceptions)
      category: Prohibitions
    - title: High-Risk AI Classification
      description: >-
        AI systems in Annex III domains classified as high-risk: biometric identification, critical infrastructure,
        education/vocational training, employment/worker management, essential services access, law enforcement,
        migration/asylum/border control, administration of justice. Also includes safety components of regulated
        products (Annex I)
      category: High-risk AI
    - title: High-Risk AI Obligations
      description: >-
        Providers of high-risk AI must implement: risk management systems, data governance, technical documentation,
        record-keeping/logging, transparency to deployers, human oversight measures, accuracy/robustness/cybersecurity
        requirements. Registration in the EU database before placing on market
      category: High-risk AI
    - title: Conformity Assessment
      description: >-
        High-risk AI systems must undergo conformity assessment before market placement. Self-assessment for most
        systems; third-party assessment required for real-time biometric identification. CE marking required.
        Post-market monitoring obligations for providers
      category: High-risk AI
    - title: Transparency Obligations
      description: >-
        AI systems interacting with persons must disclose they are AI (chatbots). Deepfakes and AI-generated content
        must be labeled. Emotion recognition and biometric categorization systems must inform subjects. Providers of
        AI-generated text published to inform the public must label it as AI-generated
      category: Transparency
    - title: GPAI Tier 1 - All Models
      description: >-
        All general-purpose AI model providers must: maintain technical documentation, provide information to
        downstream deployers, comply with EU copyright law (including opt-out mechanisms), publish a sufficiently
        detailed training content summary. Open-source models with open weights/architecture exempt from most
        requirements except copyright compliance and training summary
      category: Foundation models
    - title: GPAI Tier 2 - Systemic Risk
      description: >-
        GPAI models trained with >10^25 FLOPs (or designated by the Commission) classified as posing systemic risk.
        Additional obligations: model evaluations including adversarial testing, systemic risk assessment and
        mitigation, serious incident tracking and reporting to the AI Office, adequate cybersecurity protections
        for model weights
      category: Foundation models
    - title: Right to Explanation
      description: >-
        Individuals affected by high-risk AI system decisions have the right to obtain meaningful explanations of
        the role of the AI system in the decision-making procedure and the main elements of the decision
      category: Individual rights
    - title: European AI Office
      description: >-
        New EU body within the Commission responsible for GPAI oversight, enforcement of GPAI rules, development
        of codes of practice, coordination with national authorities. Can impose fines up to 3% of worldwide annual
        turnover or EUR 15 million for GPAI violations
      category: Governance
    - title: AI Literacy
      description: >-
        Providers and deployers must ensure staff involved in AI system operation have sufficient AI literacy,
        taking into account their technical knowledge, experience, education, and the context of use. Member States
        must promote AI literacy measures
      category: Education
  stakeholders:
    - name: European Commission
      position: support
      reason: Proposed the original regulation in April 2021; leads implementation through the European AI Office; positioned the Act as a global standard-setter
      source: https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai
    - name: European Parliament
      position: support
      reason: Strengthened the Commission's proposal by adding GPAI provisions and broader prohibitions; passed with overwhelming 523-46-49 vote
      source: https://www.europarl.europa.eu/news/en/press-room/20240308IPR19015/artificial-intelligence-act-meps-adopt-landmark-law
    - name: France, Germany, Italy
      position: oppose
      reason: Jointly opposed strict GPAI regulation during trilogue negotiations (Oct-Nov 2023); concerned about competitiveness of European AI companies like Mistral AI and Aleph Alpha
      source: https://www.euronews.com/next/2023/11/19/eu-ai-act-germany-france-and-italy-reach-agreement-on-the-future-of-ai-regulation-in-europ
    - name: Mistral AI
      entityId: mistral-ai
      position: oppose
      reason: French AI startup lobbied against GPAI rules; CEO Arthur Mensch argued obligations would disadvantage European startups against US/Chinese competitors
      source: https://www.ft.com/content/9b72a5f4-a5d8-4b9e-8a7e-4b3a5e6d2c1f
    - name: Meta
      entityId: meta-ai
      position: oppose
      reason: Opposed GPAI provisions and transparency requirements; argued rules would harm open-source AI development and European competitiveness
      source: https://about.fb.com/news/2023/06/how-ai-regulation-can-work-for-everyone/
    - name: Microsoft
      entityId: microsoft
      position: support
      reason: Supported risk-based approach; President Brad Smith called the EU AI Act a "strong foundation" and pledged compliance across Microsoft's AI products
      source: https://blogs.microsoft.com/on-the-issues/2023/05/25/how-do-we-best-govern-ai/
    - name: OpenAI
      entityId: openai
      position: support
      reason: Publicly supported the risk-based regulatory framework; CEO Sam Altman initially threatened EU exit but reversed course, calling the Act a "great starting point"
      source: https://time.com/6283609/sam-altman-openai-eu-ai-act/
    - name: Apple
      position: oppose
      reason: Lobbied against transparency and disclosure requirements for AI systems integrated into consumer products; concerned about trade secret protections
      source: https://www.reuters.com/technology/apple-lobbied-against-key-provisions-eus-ai-act-2023-07-19/
    - name: Amazon
      position: support
      reason: Supported the risk-based approach while advocating for clear definitions and proportionate compliance requirements
      source: https://www.aboutamazon.eu/news/policy/amazon-supports-the-eu-ai-act
    - name: Google DeepMind
      entityId: deepmind
      position: mixed
      reason: Supported risk-based framework in principle but lobbied for narrower GPAI definitions and raised concerns about compliance costs for foundation model research
      source: https://blog.google/around-the-globe/google-europe/google-ai-regulation-eu/
    - name: Access Now
      position: support
      reason: Digital rights organization that advocated for stronger prohibitions, particularly on biometric surveillance and social scoring; pushed for broader individual rights protections
      source: https://www.accessnow.org/campaign/eu-ai-act/
    - name: European Digital Rights (EDRi)
      position: support
      reason: Coalition of civil society groups that pushed for ban on biometric mass surveillance and predictive policing; advocated for fundamental rights impact assessments
      source: https://edri.org/our-work/the-eu-artificial-intelligence-act/
    - name: DigitalEurope
      position: oppose
      reason: Industry association representing major tech companies; argued GPAI provisions were too prescriptive and would create compliance burden that disadvantages European firms
      source: https://www.digitaleurope.org/policies/ai/
    - name: CCIA Europe
      position: oppose
      reason: Computer and Communications Industry Association lobbied against broad GPAI obligations; argued for focusing regulation on deployers rather than model providers
      source: https://ccianet.org/issues/artificial-intelligence/eu-ai-act/
  keyPoliticians:
