- id: new-york-raise-act
  stableId: sid_qHOO4Xb9dA
  wikiId: E471
  type: policy
  summaryPage: governance-overview
  title: New York RAISE Act
  introduced: 2025-03
  policyStatus: enacted
  author: Senator Andrew Gounardes, Assemblymember Alex Bores
  scope: State
  billNumber: S6953B / A6453B
  jurisdiction: New York
  provisions:
    - title: Frontier Model Coverage
      description: Applies to models trained with >10^26 FLOPs by developers with
        >$500M annual revenue
      category: Scope
    - title: Safety Protocols
      description: Risk identification and mitigation for critical harm (death/serious
        injury to 100+ people, >$1B damage, WMD assistance); required before
        training and deployment
      category: Safety
    - title: Incident Reporting
      description: Report safety incidents within 72 hours to AG and Division of
        Homeland Security
      category: Accountability
    - title: Whistleblower Protections
      description: Anonymous internal reporting; protections for contractors and
        employees; civil penalties for retaliation
      category: Worker protections
    - title: DFS Oversight Office
      description: Department of Financial Services to establish an office overseeing
        AI frontier model compliance
      category: Oversight
    - title: Penalties
      description: Civil penalties up to $1M per violation and $3M for willful
        violations, reduced from original $10M/$30M via chapter amendments
      category: Enforcement
    - title: Registration Requirement
      description: Frontier model developers must register with the state before operating
      category: Transparency
    - title: Third-Party Audits
      description: Independent annual audits to verify compliance and assess risk mitigation
      category: Oversight
  stakeholders:
    - name: Governor Kathy Hochul
      entityId: sid_T8cb9IYdlq
      position: support
      importance: high
      reason: Signed into law December 19, 2025 after negotiating chapter amendments
        that reduced civil penalties from $10M/$30M to $1M/$3M; called it
        nation-leading legislation
      source: https://www.governor.ny.gov/news/governor-hochul-signs-nation-leading-legislation-require-ai-frameworks-ai-frontier-models
      context:
        - Negotiated weaker penalties in chapter amendments before signing
          (original $10M/$30M reduced to $1M/$3M)
        - Final signed text dialed back developer requirements compared to
          legislature-passed version
        - Described by American Prospect as 'caving to Big Tech' on enforcement
          provisions
    - name: Senator Andrew Gounardes
      position: support
      importance: high
      reason: Primary sponsor and author of the Senate bill (S6953B); shepherded it
        through with 58-1 bipartisan vote
