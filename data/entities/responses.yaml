      source: https://techcrunch.com/2023/11/16/mistral-eu-ai-act/
      context:
        - Cedric O, former French secretary of state for digital transition,
          hired to lead EU relations; had direct access to President Macron
        - Argued for regulating AI applications, not model providers —
          deployer-focused approach
        - Called for a two-year delay in implementing GPAI rules alongside
          Airbus and BNP Paribas
        - Raised $415M Series B during negotiations, making it Europe's most
          valuable AI startup
    - name: Meta
      entityId: sid_tt0f5PYDCw
      position: oppose
      importance: high
      reason: Opposed GPAI provisions and transparency requirements; argued rules
