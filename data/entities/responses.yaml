      entityId: sid_H1Ysc4diAp
      position: support
      importance: high
      reason: Primary enforcement agency for AI regulations; requires pre-deployment
        approval and model registration for generative AI services with public
        opinion attributes
      source: https://digichina.stanford.edu/work/translation-interim-measures-for-the-management-of-generative-artificial-intelligence-services-effective-august-15-2023/
      context:
        - Joint issuer of Generative AI Interim Measures with six other
          government agencies
        - Maintains the algorithm registry where companies must file their AI
          models
        - Has approved and registered hundreds of generative AI platforms
          including DeepSeek and Ernie Bot
    - name: Baidu
      position: support
      importance: high
      reason: First company to launch approved generative AI service (Ernie Bot) after
        Interim Measures took effect in August 2023; quietly lobbied for
        modifications to draft regulations
      source: https://fpf.org/blog/chinas-interim-measures-for-the-management-of-generative-ai-services-a-comparison-between-the-final-and-draft-versions-of-the-text/
      context:
        - Released invite-only Ernie Bot in March 2023, months before draft
          regulations were published
        - One of the first 11 companies approved to offer generative AI to the
          public (August 2023)
        - Industry feedback from Baidu and others appeared to influence
          revisions between draft and final versions
      entityId: sid_Z1ypUKIPc0
    - name: Chinese AI companies (Alibaba, SenseTime, Zhipu AI)
      position: support
      importance: high
      reason: Major Chinese AI companies complied with and supported the regulatory
        framework; among the first batch of 11 companies approved to offer
        generative AI publicly
      source: https://securiti.ai/china-ai-regulatory-landscape/
      context:
        - Companies including SenseTime, Baichuan, and Zhipu AI among first
          approved under the framework
        - Industry stakeholder input played a documented role in softening final
          Interim Measures from the harsher draft version
        - Compliance with framework seen as necessary for market access rather
          than optional
  description: China has developed one of the world's most comprehensive AI
    regulatory frameworks through a series of targeted regulations addressing
    specific AI applications and risks. Unlike the EU's comprehensive AI Act,
    China's approach is iterative and sector-specific, with new rules issued as
    technologies emerge.
