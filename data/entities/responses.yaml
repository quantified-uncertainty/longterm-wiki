- id: colorado-ai-act
  stableId: sid_AhnHVmUdyw
  wikiId: E62
  type: policy
  summaryPage: governance-overview
  title: Colorado Artificial Intelligence Act
  introduced: 2024-04-10
  policyStatus: enacted
  author: Senator Robert Rodriguez
  scope: State
  billNumber: SB 24-205
  jurisdiction: Colorado
  provisions:
    - title: High-Risk AI System Coverage
      description: Regulates AI systems making consequential decisions across eight
        domains including employment, housing, education, healthcare, lending,
        insurance, legal services, and government services
      category: Scope
    - title: Algorithmic Discrimination Prevention
      description: Protects 12+ characteristics (age, race, disability, sex, religion,
        etc.) from disparate treatment and impact by high-risk AI systems
      category: Consumer protection
    - title: Developer Duties
      description: Developers must provide training data summary, performance metrics,
        bias risk assessment, usage guidelines, and testing results; must use
        reasonable care to protect consumers from known algorithmic
        discrimination risks
      category: Transparency
    - title: Developer AG Notification
      description: Developers must notify the Colorado Attorney General within 90 days
        of discovering that a high-risk AI system has caused algorithmic
        discrimination
      category: Enforcement
    - title: Deployer Impact Assessment
      description: Annual impact assessment required for high-risk AI systems with
        mandatory risk management policy; 3-year retention of assessment records
      category: Oversight
    - title: Consumer Disclosures and Appeal Rights
      description: Clear AI involvement notification before each consequential
        decision; consumers must be informed of the right to appeal adverse
        decisions and may request human review
      category: Consumer protection
    - title: Small Business Exemption
      description: Reduced compliance burden for small businesses deploying but not
        developing high-risk AI systems
      category: Scope
    - title: AG Enforcement
      description: Enforced exclusively by the Colorado Attorney General under the
        Colorado Consumer Protection Act; penalties up to $20,000 per violation;
        no private right of action
      category: Enforcement
  votes:
    - chamber: Senate
      date: May 3, 2024
      result: Passed
      ayes: 23
      noes: 11
      ayesDem: 18
      ayesRep: 5
      noesDem: 4
      noesRep: 7
    - chamber: House
      date: May 8, 2024
      result: Passed
      ayes: 41
      noes: 22
      ayesDem: 32
      ayesRep: 9
      noesDem: 6
      noesRep: 16
  stakeholders:
