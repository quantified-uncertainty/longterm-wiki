- id: grassroots-ai-activism
  stableId: sid_6mDLLUdlQb
  type: approach
  title: Grassroots AI Safety and Democracy Activism
  description: "Bottom-up movements mobilizing public concern about AI into
    organized political action. Includes protest movements (PauseAI, with groups
    in 30+ cities), youth-led advocacy (Encode Justice, 600 members in 40
    countries), narrative-shaping organizations (Center for Humane Technology,
    \"Your Undivided Attention\" podcast), and cross-partisan coalition building
    (FLI's Pro-Human AI Declaration, signed by groups ranging from AFL-CIO to
    Congress of Christian Leaders, with individual signatories including Steve
    Bannon and Ralph Nader). Also includes Humans First (CAIS-incubated
    bipartisan anti-AI-replacement campaign, though contested as astroturf by
    some critics). Mozilla's Democracy x AI Cohort (\\$50K per project, 10
    projects) represents funder investment in grassroots AI-democracy tools. FLI
    polling (Feb 2026, n=1,004) showed overwhelming public preference for
    \"pro-human\" AI approach over minimal regulation, suggesting grassroots
    campaigning has a receptive audience. Primary strengths: political cover for
    legislators, bipartisan framing, media attention. Primary weakness: limited
    policy specificity, risk of being outspent by industry campaigns."
