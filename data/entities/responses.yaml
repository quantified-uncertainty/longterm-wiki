- id: eu-ai-act
  stableId: sid_La8s84s3zg
  wikiId: E127
  type: policy
  summaryPage: governance-overview
  title: EU AI Act
  introduced: 2021-04
  policyStatus: enacted
  author: European Commission
  scope: International
  billNumber: Regulation (EU) 2024/1689
  jurisdiction: European Union
  fullTextUrl: https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng
  description: "The EU AI Act is the world's first comprehensive legal framework
    for artificial intelligence. Approved by the European Parliament in March
    2024 with a 523-46-49 vote, it establishes a risk-based approach with four
    tiers: unacceptable (banned), high-risk (strict obligations), limited risk
    (transparency), and minimal risk (voluntary codes). The Act introduces a
    two-tier framework for general-purpose AI (GPAI) models, with enhanced
    requirements for models posing systemic risk (trained with >10^25 FLOPs).
    Implementation is phased: prohibitions took effect February 2025, GPAI rules
    in August 2025, and high-risk obligations apply from August 2026. Fines up
    to 7% of global revenue for violations."
  provisions:
    - title: Prohibited AI Practices
      description: Bans social scoring by governments, subliminal/manipulative AI
        techniques causing harm, exploitation of vulnerabilities (age,
        disability), untargeted scraping for facial recognition databases,
        emotion recognition in workplaces/schools, and real-time remote
        biometric identification in public spaces (with narrow law enforcement
        exceptions)
      category: Prohibitions
    - title: High-Risk AI Classification
      description: "AI systems in Annex III domains classified as high-risk: biometric
        identification, critical infrastructure, education/vocational training,
        employment/worker management, essential services access, law
        enforcement, migration/asylum/border control, administration of justice.
        Also includes safety components of regulated products (Annex I)"
      category: High-risk AI
    - title: High-Risk AI Obligations
      description: "Providers of high-risk AI must implement: risk management systems,
        data governance, technical documentation, record-keeping/logging,
        transparency to deployers, human oversight measures,
        accuracy/robustness/cybersecurity requirements. Registration in the EU
        database before placing on market"
      category: High-risk AI
    - title: Conformity Assessment
      description: High-risk AI systems must undergo conformity assessment before
        market placement. Self-assessment for most systems; third-party
        assessment required for real-time biometric identification. CE marking
        required. Post-market monitoring obligations for providers
      category: High-risk AI
    - title: Transparency Obligations
      description: AI systems interacting with persons must disclose they are AI
        (chatbots). Deepfakes and AI-generated content must be labeled. Emotion
        recognition and biometric categorization systems must inform subjects.
        Providers of AI-generated text published to inform the public must label
        it as AI-generated
      category: Transparency
    - title: GPAI Tier 1 - All Models
      description: "All general-purpose AI model providers must: maintain technical
        documentation, provide information to downstream deployers, comply with
        EU copyright law (including opt-out mechanisms), publish a sufficiently
        detailed training content summary. Open-source models with open
        weights/architecture exempt from most requirements except copyright
        compliance and training summary"
      category: Foundation models
    - title: GPAI Tier 2 - Systemic Risk
      description: "GPAI models trained with >10^25 FLOPs (or designated by the
        Commission) classified as posing systemic risk. Additional obligations:
        model evaluations including adversarial testing, systemic risk
        assessment and mitigation, serious incident tracking and reporting to
        the AI Office, adequate cybersecurity protections for model weights"
      category: Foundation models
    - title: Right to Explanation
      description: Individuals affected by high-risk AI system decisions have the
        right to obtain meaningful explanations of the role of the AI system in
        the decision-making procedure and the main elements of the decision
      category: Individual rights
    - title: European AI Office
      description: New EU body within the Commission responsible for GPAI oversight,
        enforcement of GPAI rules, development of codes of practice,
        coordination with national authorities. Can impose fines up to 3% of
        worldwide annual turnover or EUR 15 million for GPAI violations
      category: Governance
    - title: AI Literacy
      description: Providers and deployers must ensure staff involved in AI system
        operation have sufficient AI literacy, taking into account their
        technical knowledge, experience, education, and the context of use.
        Member States must promote AI literacy measures
      category: Education
  stakeholders:
    - name: European Commission
      entityId: sid_3zsTSX6SFK
      position: support
      importance: high
      reason: Proposed the original regulation in April 2021; leads implementation
        through the European AI Office; positioned the Act as a global
        standard-setter for AI governance
      source: https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai
      context:
        - Commissioner Thierry Breton led the regulatory agenda; Ursula von der
          Leyen included AI regulation in 2019 political guidelines
        - European AI Office established within the Commission to oversee GPAI
          enforcement
        - Can impose fines up to 3% of worldwide annual turnover for GPAI
          violations
    - name: European Parliament
      entityId: sid_jWgzHpf77P
      position: support
      importance: high
      reason: Strengthened the Commission's proposal by adding GPAI provisions and
        broader prohibitions; passed with overwhelming 523-46-49 vote on March
        13, 2024
      source: https://www.europarl.europa.eu/news/en/press-room/20240308IPR19015/artificial-intelligence-act-meps-adopt-landmark-law
      context:
        - Co-rapporteurs Brando Benifei (S&D) and Dragos Tudorache (Renew) led
          negotiations
        - GPAI tiered approach was Parliament's addition — not in original
          Commission proposal
        - Resisted last-minute EPP attempt to water down biometric surveillance
          bans
    - name: France, Germany, Italy
      position: oppose
      importance: high
      reason: Jointly opposed strict GPAI regulation during trilogue negotiations (Nov
        2023); pushed for self-regulation via codes of conduct without
        sanctions, citing competitiveness of Mistral AI and Aleph Alpha
      source: https://www.euronews.com/next/2023/11/19/eu-ai-act-germany-france-and-italy-reach-agreement-on-the-future-of-ai-regulation-in-europ
      context:
        - Joint non-paper proposed mandatory self-regulation for foundation
          models with no sanctions
        - Near-collapse of trilogue negotiations; compromise reached after 36+
          hours of marathon talks
        - "Under pressure from national AI companies: Mistral AI (France) and
          Aleph Alpha (Germany)"
        - "Final outcome: tiered GPAI approach was a compromise — binding rules
          with systemic risk threshold at 10^25 FLOPs"
    - name: Mistral AI
      entityId: sid_RFHVboBnHg
      position: oppose
      importance: high
      reason: Led lobbying against GPAI rules; opened Brussels lobby office with
