global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector-metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
