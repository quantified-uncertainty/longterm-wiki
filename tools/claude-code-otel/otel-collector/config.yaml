receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  # Auto-tag every metric with the host name + OS, so multi-machine
  # deployments don't collide. Replaces the unsafe `$(hostname)` expansion
  # that was previously in env.example (it doesn't expand inside .env files).
  resourcedetection:
    detectors: [system, env]
    system:
      hostname_sources: [os]

  # Drop high-cardinality / PII attributes that Claude Code may emit.
  # Keep slot/branch/model/tool which we want to aggregate by.
  attributes/scrub:
    actions:
      - key: user.id
        action: delete
      - key: user.email
        action: delete
      - key: api.key
        action: delete

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    metric_expiration: 30m
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, attributes/scrub, batch]
      exporters: [prometheus]
