name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
    # labeled/unlabeled needed for protected-paths-check and coderabbit-security-gate
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

# Cancel superseded runs for the same PR/branch (saves ~3 min per cancelled run).
# Runs on main and merge queue are never cancelled (each SHA produces a unique group).
# Label events get their own group so they don't cancel in-progress CI builds.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'label' || 'main' }}
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  ci:
    # Skip the main CI job on label events — only gate checks need those.
    if: >-
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Block PRs to production from non-main branches
        if: github.event_name == 'pull_request' && github.base_ref == 'production'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != "main" ]]; then
            echo "::error::PRs to production must come from 'main'. Got: '$HEAD_REF'"
            echo "Merge your changes to main first, then the release workflow will open a PR from main → production."
            exit 1
          fi
          echo "::notice::Release PR: use 'Create a merge commit' — never squash. Squash merges cause conflicts on the next release."

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      # --- Security: dependency audit (advisory, non-blocking) ---

      - name: Dependency security audit
        continue-on-error: true
        run: pnpm audit --audit-level=high 2>/dev/null || echo "::warning::Dependency audit found high-severity vulnerabilities — run 'pnpm audit' locally for details"

      # --- Build data (once, shared by all subsequent steps) ---

      - name: Build data
        run: cd apps/web && node --import tsx/esm scripts/build-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}

      # --- Validation (fail fast before expensive Next.js build) ---

      - name: Install actionlint
        run: |
          gh release download --repo rhysd/actionlint --pattern 'actionlint_*_linux_amd64.tar.gz' -O /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
        env:
          GH_TOKEN: ${{ github.token }}

      - name: GitHub Actions YAML validation — actionlint (blocking)
        run: npx tsx crux/validate/validate-actions-yaml.ts

      - name: Actionlint — reviewdog annotations
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          actionlint -shellcheck= -oneline .github/workflows/*.yml 2>&1 \
            | reviewdog -efm="%f:%l:%c: %m" -name="actionlint" \
              -reporter=github-pr-check \
              -filter-mode=added \
              -fail-level=none

      - name: MDX syntax check (blocking)
        run: pnpm crux validate unified --rules=comparison-operators,dollar-signs --errors-only

      - name: YAML schema validation (blocking)
        run: pnpm crux validate schema

      - name: Frontmatter schema validation (blocking)
        run: pnpm crux validate unified --rules=frontmatter-schema --errors-only

      - name: Wiki ID integrity (blocking)
        run: pnpm crux validate unified --rules=wiki-id-integrity --errors-only

      - name: TypeScript type checks (parallel)
        run: |
          pids=()
          (cd apps/web && npx tsc --noEmit) &
          pids+=($!)
          (cd apps/discord-bot && npx tsc --noEmit) &
          pids+=($!)
          (cd apps/wiki-server && npx tsc --noEmit) &
          pids+=($!)
          (cd apps/groundskeeper && npx tsc --noEmit) &
          pids+=($!)
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          exit $failed

      - name: TypeScript type check — crux (advisory, baseline-guarded)
        continue-on-error: true
        run: npx tsx crux/validate/validate-crux-tsc.ts --ci

      - name: .returning() guard check (blocking)
        run: npx tsx crux/validate/validate-returning-guard.ts

      - name: Drizzle migration journal integrity (blocking)
        run: npx tsx crux/validate/validate-drizzle-journal.ts

      - name: Drizzle schema drift detection (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The default checkout is shallow (depth=1). The drift check uses
          # `git diff BASE...HEAD` (3-dot), which requires the merge-base of both
          # SHAs. Fetch enough history so the merge-base is available; without
          # this, getChangedFiles() silently returns [] → false-negative.
          git fetch --unshallow 2>/dev/null || git fetch --depth=100 origin 2>/dev/null || true
          npx tsx crux/validate/validate-schema-drift.ts \
            || echo "::warning::Schema drift check failed unexpectedly — review validator output above"

      - name: Auto-update orchestrator smoke test (dry-run)
        if: "!cancelled()"
        continue-on-error: true
        run: |
          pnpm crux auto-update run --dry-run --skip-fetch --trigger=ci-check --budget=0 --count=0 \
            || echo "::warning::Auto-update dry-run failed (advisory — check orchestrator for regressions)"

      - name: Component reference validation (blocking)
        run: pnpm crux validate refs

      - name: Crux validation — reviewdog annotations
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx tsx crux/validate/validate-unified.ts --ci \
            | npx tsx crux/validate/to-rdjsonl.ts \
            | reviewdog -f=rdjsonl -name="crux-validate" \
              -reporter=github-pr-check \
              -filter-mode=added \
              -fail-level=none

      - name: Run validation suite (advisory)
        if: "!cancelled()"
        continue-on-error: true
        run: |
          pnpm crux validate || echo "::warning::Validation has pre-existing failures (non-blocking)"

      # --- Tests (with coverage reporting) ---

      - name: Run tests (web)
        run: cd apps/web && pnpm vitest run --coverage

      - name: Run tests (discord-bot)
        run: cd apps/discord-bot && pnpm vitest run --coverage

      - name: Run tests (wiki-server)
        run: cd apps/wiki-server && pnpm vitest run --coverage

      - name: Run tests (crux)
        run: npx vitest run --config crux/vitest.config.ts --coverage

      - name: Generate coverage report
        if: "!cancelled() && github.event_name == 'pull_request'"
        continue-on-error: true
        run: npx tsx crux/ci/merge-coverage.ts --output=/tmp/coverage-report.md

      - name: Post coverage comment on PR
        if: "!cancelled() && github.event_name == 'pull_request'"
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: /tmp/coverage-report.md

      # --- Next.js build (most expensive step — runs last) ---

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'content/docs/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build Next.js
        run: cd apps/web && pnpm build
        env:
          SKIP_PREBUILD: "1"
          LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}

  migrate-test:
    # Skip on label events — only gate checks need those.
    if: >-
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    name: Test DB migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: longterm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/longterm_test
        run: pnpm --filter wiki-server db:migrate

  sync-content:
    # Sync wiki page content to wiki-server after build succeeds on main.
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build data
        run: cd apps/web && node --import tsx/esm scripts/build-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}

      - name: Sync pages to wiki-server
        run: pnpm crux wiki-server sync
        env:
          LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}

  # When CI fails on main, auto-file a GitHub issue labeled for agent pickup.
  # The groundskeeper issue-responder picks up `groundskeeper-autofix` issues
  # and spawns a Claude Code session to fix them automatically.
  file-regression-issue:
    needs: [ci]
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: File regression issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the merge commit that likely caused the failure
          LAST_MERGE=$(git log --merges --oneline -1 --format="%H %s")
          LAST_SHA=$(echo "$LAST_MERGE" | cut -d' ' -f1)
          LAST_MSG=$(echo "$LAST_MERGE" | cut -d' ' -f2-)

          # Extract PR number from merge commit message if present
          PR_NUM=$(echo "$LAST_MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          PR_REF=""
          if [ -n "$PR_NUM" ]; then
            PR_REF=" (from PR #${PR_NUM})"
          fi

          TITLE="CI broken on main after ${LAST_SHA:0:7}${PR_REF}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="## Problem

          CI failed on \`main\` after merging commit \`${LAST_SHA:0:10}\`: ${LAST_MSG}

          Run: ${RUN_URL}

          ## Suggested Fix

          Check the failing CI step in the run above, identify the regression, and fix it.

          ## Acceptance Criteria

          - [ ] CI passes on main
          - [ ] Root cause identified and fixed"
          # Strip leading whitespace from each line (heredoc-style dedent)
          BODY=$(echo "$BODY" | sed 's/^          //')

          # Check for an existing open issue to avoid duplicates
          EXISTING=$(gh issue list --label "groundskeeper-autofix" --state open --limit 5 --json title --jq '.[].title' | grep -c "CI broken on main" || true)
          if [ "$EXISTING" -gt 0 ]; then
            echo "Existing CI-broken issue already open — skipping duplicate."
            exit 0
          fi

          gh issue create --title "$TITLE" --body "$BODY" --label "bug,groundskeeper-autofix"

  deploy:
    # Trigger Vercel production deployment after CI passes on the production branch.
    # Vercel GitHub integration is disabled (vercel.json github.enabled=false) to
    # prevent PR failure statuses — deploy hooks bypass the GitHub integration.
    # The VERCEL_PRODUCTION_DEPLOY_HOOK_URL secret must be a hook configured for the "production" branch.
    # VERCEL_MAIN_DEPLOY_HOOK_URL is a separate hook for the "main" branch (used by scheduled-deploy.yml).
    needs: [ci, migrate-test]
    if: vars.AUTOMATION_PAUSED != 'true' && github.ref == 'refs/heads/production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Vercel production deployment
        run: |
          if [ -z "${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::VERCEL_PRODUCTION_DEPLOY_HOOK_URL secret is not set."
            echo "Go to Vercel Dashboard → Project → Settings → Git → Deploy Hooks"
            echo "Create a hook for Branch 'production', then add the URL as a GitHub secret."
            exit 1
          fi

          RESPONSE=$(curl -s -o /tmp/vercel_response.json -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK_URL }}")

          echo "HTTP status: $RESPONSE"
          cat /tmp/vercel_response.json

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "Production deployment triggered."
          else
            echo "::error::Vercel deploy hook returned HTTP $RESPONSE"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # PR gate checks (merged from standalone workflows)
  #
  # These were previously separate workflow files. They run only on PRs and are
  # lightweight enough to be jobs in ci.yml. If any of these were required status
  # checks, branch protection rules may need updating to match the new job names.
  #
  # Merged workflows:
  #   - pr-size-check.yml          → pr-size-check
  #   - protected-paths-check.yml  → protected-paths-check
  #   - squawk-lint.yml            → squawk-lint
  #   - migration-integrity.yml    → migration-integrity
  #   - coderabbit-security-gate.yml → coderabbit-security-gate
  # ---------------------------------------------------------------------------

  pr-size-check:
    name: PR Size Check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size and comment if large
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { execSync } = require('child_process');
            const WARN_THRESHOLD = 500;
            const LARGE_THRESHOLD = 1000;

            // Get per-file diff stats, filtering out test/generated/content files.
            // We only count non-test infrastructure additions since large infra PRs
            // correlate with post-merge bugs; test and content PRs are low-risk.
            //
            // Excluded patterns:
            //   *.test.ts / *.test.tsx / *.spec.ts — test files
            //   content/docs/** — MDX wiki content (low risk)
            //   **/*.snap — Jest/Vitest snapshots
            //   apps/web/public/** — static assets
            //   pnpm-lock.yaml — generated lockfile
            const BASE = process.env.BASE_SHA;
            const HEAD = process.env.HEAD_SHA;
            const rawDiff = execSync(
              `git diff --numstat ${BASE}...${HEAD}`,
              { encoding: 'utf-8' }
            );

            const EXCLUDED = [
              /\.test\.[jt]sx?$/,
              /\.spec\.[jt]sx?$/,
              /^content\/docs\//,
              /\.snap$/,
              /^apps\/web\/public\//,
              /^pnpm-lock\.yaml$/,
            ];

            let infraAdditions = 0;
            let totalAdditions = 0;
            let totalDeletions = 0;
            let filesChanged = 0;

            for (const line of rawDiff.trim().split('\n').filter(Boolean)) {
              const [adds, dels, file] = line.split('\t');
              if (!file) continue;
              const addCount = parseInt(adds, 10) || 0;
              const delCount = parseInt(dels, 10) || 0;
              totalAdditions += addCount;
              totalDeletions += delCount;
              filesChanged++;
              const isExcluded = EXCLUDED.some(p => p.test(file));
              if (!isExcluded) {
                infraAdditions += addCount;
              }
            }

            console.log(
              `PR additions: ${totalAdditions} total, ${infraAdditions} non-test/content ` +
              `(${totalDeletions} deletions, ${filesChanged} files)`
            );

            if (infraAdditions <= WARN_THRESHOLD) {
              console.log(`PR size OK: ${infraAdditions} non-test additions (threshold: ${WARN_THRESHOLD})`);
              return;
            }

            // Check if we already posted a size warning (avoid duplicates on re-push)
            const MARKER = '<!-- pr-size-check -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(MARKER));

            const level = infraAdditions > LARGE_THRESHOLD ? 'large' : 'medium';
            const emoji = level === 'large' ? '🔴' : '🟡';
            const body = [
              MARKER,
              `${emoji} **PR Size Warning**: ${infraAdditions} non-test additions across ${filesChanged} files.`,
              '',
              level === 'large'
                ? `This PR exceeds ${LARGE_THRESHOLD} non-test additions. Consider splitting into smaller, staged PRs (see [#1252](https://github.com/quantified-uncertainty/longterm-wiki/issues/1252)).`
                : `This PR exceeds ${WARN_THRESHOLD} non-test additions. If possible, consider whether it could be split into smaller PRs.`,
              '',
              `_Test files, wiki content, snapshots, and lockfiles are excluded from this count (low-risk additions)._`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Non-test additions | +${infraAdditions} |`,
              `| Total additions | +${totalAdditions} |`,
              `| Deletions | -${totalDeletions} |`,
              `| Files changed | ${filesChanged} |`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated existing size warning (${infraAdditions} non-test additions)`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log(`Posted size warning (${infraAdditions} non-test additions)`);
            }

  protected-paths-check:
    # Flags PRs that modify agent behavioral rules, CI workflows, or validation
    # code for mandatory human review. Without the `gate:rules-ok` label,
    # the check fails so these changes cannot merge unnoticed.
    name: Protected Paths Check
    if: >-
      github.event_name == 'pull_request' && (
        github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
        github.event.label.name == 'gate:rules-ok'
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check for protected path changes
        uses: actions/github-script@v7
        with:
          script: |
            const PROTECTED_PATTERNS = [
              /^CLAUDE\.md$/,
              /^\.claude\/rules\//,
              /^\.claude\/memory\//,
              /^\.claude\/commands\//,
              /^\.claude\/settings\.json$/,
              /^\.claude\/hooks\//,
              /^\.github\/workflows\//,
              /^\.githooks\//,
              /^crux\/validate\//,
              /^crux\/commands\//,
              /^crux\/lib\/session-checklist\.ts$/,
              /^crux\/lib\/page-templates\.ts$/,
              /^crux\/auto-update\//,
              /^\.squawk\.toml$/,
            ];

            const REVIEW_LABEL = 'gate:rules-ok';
            const COMMENT_MARKER = '<!-- protected-paths-check -->';

            // Get list of files changed in this PR
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              }
            );

            const changedPaths = files.map(f => f.filename);
            const protectedFiles = changedPaths.filter(path =>
              PROTECTED_PATTERNS.some(pattern => pattern.test(path))
            );

            if (protectedFiles.length === 0) {
              console.log('No protected paths modified. Check passes.');
              return;
            }

            // Group by category for readable output
            const categories = {
              'Agent instructions (CLAUDE.md)': [],
              'Agent rules (.claude/rules/)': [],
              'Agent memory (.claude/memory/)': [],
              'Agent commands (.claude/commands/)': [],
              'Agent settings (.claude/settings.json)': [],
              'Agent hooks (.claude/hooks/)': [],
              'CI workflows (.github/workflows/)': [],
              'Git hooks (.githooks/)': [],
              'Validation code (crux/validate/)': [],
              'CLI commands (crux/commands/)': [],
              'Session checklist (crux/lib/session-checklist.ts)': [],
              'Page templates (crux/lib/page-templates.ts)': [],
              'Auto-update system (crux/auto-update/)': [],
              'Linter config (.squawk.toml)': [],
            };

            for (const file of protectedFiles) {
              if (/^CLAUDE\.md$/.test(file)) categories['Agent instructions (CLAUDE.md)'].push(file);
              else if (/^\.claude\/rules\//.test(file)) categories['Agent rules (.claude/rules/)'].push(file);
              else if (/^\.claude\/memory\//.test(file)) categories['Agent memory (.claude/memory/)'].push(file);
              else if (/^\.claude\/commands\//.test(file)) categories['Agent commands (.claude/commands/)'].push(file);
              else if (/^\.claude\/settings\.json$/.test(file)) categories['Agent settings (.claude/settings.json)'].push(file);
              else if (/^\.claude\/hooks\//.test(file)) categories['Agent hooks (.claude/hooks/)'].push(file);
              else if (/^\.github\/workflows\//.test(file)) categories['CI workflows (.github/workflows/)'].push(file);
              else if (/^\.githooks\//.test(file)) categories['Git hooks (.githooks/)'].push(file);
              else if (/^crux\/validate\//.test(file)) categories['Validation code (crux/validate/)'].push(file);
              else if (/^crux\/commands\//.test(file)) categories['CLI commands (crux/commands/)'].push(file);
              else if (/^crux\/lib\/session-checklist\.ts$/.test(file)) categories['Session checklist (crux/lib/session-checklist.ts)'].push(file);
              else if (/^crux\/lib\/page-templates\.ts$/.test(file)) categories['Page templates (crux/lib/page-templates.ts)'].push(file);
              else if (/^crux\/auto-update\//.test(file)) categories['Auto-update system (crux/auto-update/)'].push(file);
              else if (/^\.squawk\.toml$/.test(file)) categories['Linter config (.squawk.toml)'].push(file);
            }

            // Check if the review label is present AND was added by a human
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const hasReviewLabel = labels.some(l => l.name === REVIEW_LABEL);

            // If the label is present, verify it was added by a human (not a bot or agent)
            // This prevents agents from self-applying the label to bypass review.
            const DISALLOWED_LABEL_ACTORS = [
              'github-actions[bot]',
              'dependabot[bot]',
            ];
            const DISALLOWED_ACTOR_PATTERNS = [
              /^claude-/i,
            ];

            function isDisallowedActor(login) {
              if (DISALLOWED_LABEL_ACTORS.includes(login)) return true;
              return DISALLOWED_ACTOR_PATTERNS.some(p => p.test(login));
            }

            let labelAddedByHuman = false;
            let labelActorName = null;

            if (hasReviewLabel) {
              // Fetch timeline events to find who added the label
              const events = await github.paginate(
                github.rest.issues.listEvents,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  per_page: 100,
                }
              );

              // Find the most recent 'labeled' event for our review label
              const labelEvents = events.filter(
                e => e.event === 'labeled' && e.label?.name === REVIEW_LABEL
              );
              const mostRecent = labelEvents[labelEvents.length - 1];

              if (mostRecent && mostRecent.actor) {
                labelActorName = mostRecent.actor.login;
                labelAddedByHuman = !isDisallowedActor(labelActorName);
              }

              if (!labelAddedByHuman) {
                console.log(`Label "${REVIEW_LABEL}" was added by "${labelActorName || 'unknown'}" which is not an allowed reviewer.`);
              } else {
                console.log(`Label "${REVIEW_LABEL}" was added by "${labelActorName}" — accepted as human reviewer.`);
              }
            }

            // The label counts only if it exists AND was added by an allowed actor
            const reviewApproved = hasReviewLabel && labelAddedByHuman;

            // Build the comment body
            const statusIcon = reviewApproved ? '✅' : '🛑';
            let statusText;
            if (reviewApproved) {
              statusText = `The \`${REVIEW_LABEL}\` label is present (added by \`${labelActorName}\`). A human has acknowledged these changes.`;
            } else if (hasReviewLabel && !labelAddedByHuman) {
              statusText = `**Action required**: The \`${REVIEW_LABEL}\` label was added by \`${labelActorName || 'unknown'}\`, which is not recognized as a human reviewer. A human must remove and re-add the label for it to count.`;
            } else {
              statusText = `**Action required**: Add the \`${REVIEW_LABEL}\` label after a human has reviewed the protected file changes.`;
            }

            const fileList = Object.entries(categories)
              .filter(([, files]) => files.length > 0)
              .map(([category, files]) => {
                const items = files.map(f => `  - \`${f}\``).join('\n');
                return `**${category}**\n${items}`;
              })
              .join('\n\n');

            const body = [
              COMMENT_MARKER,
              `## ${statusIcon} Protected Paths Modified`,
              '',
              `This PR modifies **${protectedFiles.length} protected file(s)** that control agent behavior, CI pipelines, or validation logic. These changes require human review before merging.`,
              '',
              fileList,
              '',
              '---',
              '',
              statusText,
              '',
              `> **Why this check exists**: Agents have write access to their own behavioral rules. Without human review, a rule change buried in a large PR could weaken validation, bypass gates, or modify agent instructions. See [#1405](https://github.com/quantified-uncertainty/longterm-wiki/issues/1405).`,
            ].join('\n');

            // Post or update the comment (paginated to handle PRs with many comments)
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );
            const existing = comments.find(c => c.body && c.body.includes(COMMENT_MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log('Updated existing protected-paths comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Posted protected-paths comment.');
            }

            // Fail the check if the review label is missing or was not added by a human
            if (!reviewApproved) {
              if (hasReviewLabel && !labelAddedByHuman) {
                core.setFailed(
                  `This PR modifies ${protectedFiles.length} protected file(s). The "${REVIEW_LABEL}" label is present but was added by "${labelActorName || 'unknown'}", ` +
                  `which is not recognized as a human reviewer. A human must remove and re-add the label for it to count.`
                );
              } else {
                core.setFailed(
                  `This PR modifies ${protectedFiles.length} protected file(s) but is missing the "${REVIEW_LABEL}" label. ` +
                  `A human must review the changes to agent rules, CI workflows, or validation code and add the label before this PR can merge.`
                );
              }
            } else {
              console.log(`Protected files modified but "${REVIEW_LABEL}" label is present (added by "${labelActorName}"). Check passes.`);
            }

  squawk-lint:
    # Lint SQL migration files with squawk. Only does work when migration
    # files are changed; skips gracefully otherwise.
    name: SQL Migration Lint (squawk)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed migration files
        id: changed
        run: |
          # Get SQL files changed in this PR relative to the base branch
          CHANGED=$(git diff --name-only --diff-filter=ACM \
            "origin/${{ github.base_ref }}...HEAD" -- 'apps/wiki-server/drizzle/*.sql' \
            | tr '\n' ' ' | xargs)
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "No migration files changed — skipping lint"
          else
            echo "Linting: $CHANGED"
          fi

      - name: Install squawk-cli
        if: steps.changed.outputs.files != ''
        run: npm install -g squawk-cli

      - name: Run squawk on changed migrations
        if: steps.changed.outputs.files != ''
        # Exit code 1 means violations found — fail the check.
        # squawk exits 0 when there are no issues.
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          # Exclude migrations that intentionally drop tables (ban-drop-table).
          # 0073: drops orphaned table (0 rows, no code references)
          # 0127: unified verification system — drops 6 old tables replaced by 2 new ones (#2950)
          EXCLUDED="0073_drop_orphaned_kb_fact_verifications.sql 0127_unified_verification_tables.sql"
          FILTERED=""
          for f in $CHANGED_FILES; do
            skip=false
            for ex in $EXCLUDED; do
              if echo "$f" | grep -q "$ex"; then skip=true; break; fi
            done
            if [ "$skip" = "false" ]; then FILTERED="$FILTERED $f"; fi
          done
          FILTERED=$(echo "$FILTERED" | xargs)
          if [ -z "$FILTERED" ]; then
            echo "All changed migrations are excluded — nothing to lint"
            exit 0
          fi
          echo "Linting: $FILTERED"
          # shellcheck disable=SC2086
          squawk $FILTERED

  migration-integrity:
    # Checks that existing migration files are not modified and that the
    # Drizzle journal is consistent. Only runs when migration files change.
    name: Migration Integrity Check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration file changes
        id: detect
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD -- \
            'apps/wiki-server/drizzle/[0-9]*.sql' \
            'apps/wiki-server/drizzle/meta/_journal.json' \
            | head -1)
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No migration files changed — skipping integrity check"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for modified migrations
        if: steps.detect.outputs.has_changes == 'true'
        env:
          MIGRATION_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'migration-override') }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"

          # Get list of migration SQL files that were MODIFIED (not added)
          MODIFIED=$(git diff --name-only --diff-filter=M "$BASE_SHA"...HEAD -- 'apps/wiki-server/drizzle/[0-9]*.sql')

          if [ -n "$MODIFIED" ] && [ "$MIGRATION_OVERRIDE" != "true" ]; then
            echo "::error::The following migration files were modified. Migrations must never be modified after being committed — they may have already been applied to production databases. Create a new migration instead."
            echo ""
            echo "$MODIFIED" | while read -r file; do
              echo "::error file=${file}::${file} was modified. Create a new migration to make changes."
            done
            echo ""
            echo "If you are absolutely certain this migration has not been applied anywhere, you can add the 'migration-override' label to this PR to bypass this check."
            exit 1
          fi

          if [ -n "$MODIFIED" ]; then
            echo "::warning::migration-override label present; skipping modified-migration failure."
          else
            echo "No existing migrations were modified. ✓"
          fi

      - name: Check journal ordering
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          # Verify _journal.json entries are in strictly increasing idx order
          python3 -c "
          import json, os, sys

          with open('apps/wiki-server/drizzle/meta/_journal.json') as f:
              journal = json.load(f)

          entries = journal['entries']
          errors = []

          # Build set of expected SQL files from journal
          expected_sql_files = set()

          for i, entry in enumerate(entries):
              if entry['idx'] != i:
                  errors.append(f'Entry {i} has idx={entry[\"idx\"]}, expected {i}')

              if i > 0 and entry['when'] <= entries[i-1]['when']:
                  errors.append(f'Entry {i} ({entry[\"tag\"]}) has when={entry[\"when\"]} <= previous entry when={entries[i-1][\"when\"]}')

              # Check that the SQL file exists
              sql_file = f'apps/wiki-server/drizzle/{entry[\"tag\"]}.sql'
              expected_sql_files.add(sql_file)
              if not os.path.exists(sql_file):
                  errors.append(f'Entry {i} references {sql_file} but file does not exist')

          # Reverse check: SQL files in the directory must be in the journal
          actual_sql_files = {
              os.path.join('apps/wiki-server/drizzle', name)
              for name in os.listdir('apps/wiki-server/drizzle')
              if name.endswith('.sql') and name[:4].isdigit()
          }
          for sql_file in sorted(actual_sql_files - expected_sql_files):
              errors.append(f'{sql_file} exists but is not referenced by _journal.json')

          if errors:
              for e in errors:
                  print(f'::error::{e}', file=sys.stderr)
              sys.exit(1)

          print(f'Journal integrity check passed: {len(entries)} entries, all valid. ✓')
          "

  coderabbit-security-gate:
    # Blocks merges when CodeRabbit has unresolved Critical or Major review threads.
    # A human can override by adding the `gate:security-ok` label.
    #
    # Why this gate exists: CodeRabbit flagged 3 security issues across PRs #1613,
    # #1623, and #1634 that were self-merged without human review. See issue #1649.
    #
    # How to override:
    #   1. Review the CodeRabbit findings (resolve each thread or acknowledge it)
    #   2. Add the `gate:security-ok` label to the PR
    #   3. The check will re-run and pass
    #
    # Note: The label must be added by a human — bots and claude-* actors are
    # disallowed to prevent self-bypass.
    name: CodeRabbit Security Gate
    if: >-
      github.event_name == 'pull_request' && (
        github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
        github.event.label.name == 'gate:security-ok'
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
    steps:
      - name: Check for unresolved CodeRabbit critical/major findings
        uses: actions/github-script@v7
        with:
          script: |
            const OVERRIDE_LABEL = 'gate:security-ok';
            const COMMENT_MARKER = '<!-- coderabbit-security-gate -->';
            // CodeRabbit appears as 'coderabbitai' in GraphQL but 'coderabbitai[bot]' in REST.
            // Accept both to be resilient to API differences.
            const CODERABBIT_LOGINS = new Set(['coderabbitai', 'coderabbitai[bot]']);

            // Severity patterns that require dismissal
            const BLOCKING_SEVERITY_RE = /🔴 Critical|🟠 Major/;

            // Actors not allowed to apply the override label.
            // Belt-and-suspenders: check actor.type === 'Bot' (covers ALL GitHub bots/apps),
            // plus a [bot] suffix check for safety, plus explicit logins and name patterns.
            const DISALLOWED_LABEL_ACTORS = new Set([
              'github-actions[bot]',
              'dependabot[bot]',
            ]);
            const DISALLOWED_ACTOR_PATTERNS = [
              /^claude-/i,
            ];

            function isDisallowedActor(actor) {
              const login = actor?.login ?? '';
              const type = (actor?.type ?? '').toLowerCase();
              // GitHub sets type='Bot' for all bot accounts and GitHub Apps
              if (type === 'bot') return true;
              // Belt-and-suspenders: [bot] suffix catches any bot the type check misses
              if (/\[bot\]$/i.test(login)) return true;
              if (DISALLOWED_LABEL_ACTORS.has(login)) return true;
              return DISALLOWED_ACTOR_PATTERNS.some(p => p.test(login));
            }

            // --- 1. Fetch review threads via GraphQL (paginated) ---
            // Pagination prevents false negatives on PRs with >100 review threads.
            const query = `query($owner: String!, $name: String!, $number: Int!, $after: String) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100, after: $after) {
                    pageInfo {
                      hasNextPage
                      endCursor
                    }
                    nodes {
                      isResolved
                      isOutdated
                      path
                      line
                      comments(first: 3) {
                        nodes {
                          author { login }
                          body
                        }
                      }
                    }
                  }
                }
              }
            }`;

            const threads = [];
            let hasNextPage = true;
            let afterCursor = null;
            while (hasNextPage) {
              const gqlResult = await github.graphql(query, {
                owner: context.repo.owner,
                name: context.repo.repo,
                number: context.issue.number,
                after: afterCursor,
              });
              const reviewThreads = gqlResult.repository.pullRequest.reviewThreads;
              threads.push(...reviewThreads.nodes);
              hasNextPage = reviewThreads.pageInfo.hasNextPage;
              afterCursor = reviewThreads.pageInfo.endCursor;
            }

            // Find unresolved, non-outdated CodeRabbit threads with blocking severity
            const blockingThreads = threads.filter(thread => {
              if (thread.isResolved || thread.isOutdated) return false;
              const firstComment = thread.comments.nodes[0];
              if (!firstComment?.author?.login) return false;
              if (!CODERABBIT_LOGINS.has(firstComment.author.login)) return false;
              return BLOCKING_SEVERITY_RE.test(firstComment.body);
            });

            console.log(`Found ${threads.length} review threads total`);
            console.log(`Blocking unresolved CodeRabbit threads: ${blockingThreads.length}`);

            // --- 2. Check override label ---
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const hasOverrideLabel = labels.some(l => l.name === OVERRIDE_LABEL);

            let labelAddedByHuman = false;
            let labelActorName = null;

            if (hasOverrideLabel) {
              const events = await github.paginate(
                github.rest.issues.listEvents,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  per_page: 100,
                }
              );

              const labelEvents = events.filter(
                e => e.event === 'labeled' && e.label?.name === OVERRIDE_LABEL
              );
              const mostRecent = labelEvents[labelEvents.length - 1];

              if (mostRecent?.actor) {
                labelActorName = mostRecent.actor.login;
                // Pass the full actor object so isDisallowedActor can check actor.type
                labelAddedByHuman = !isDisallowedActor(mostRecent.actor);
              }
            }

            const overrideApproved = hasOverrideLabel && labelAddedByHuman;

            // --- 3. Decide pass/fail ---
            const shouldBlock = blockingThreads.length > 0 && !overrideApproved;

            // --- 4. Build thread summary ---
            const threadDetails = blockingThreads.slice(0, 10).map(thread => {
              const comment = thread.comments.nodes[0];
              // Extract severity from first line
              const firstLine = comment.body.split('\n')[0] ?? '';
              const excerpt = comment.body.slice(0, 300).replace(/\n+/g, ' ');
              return `- **${thread.path}**${thread.line ? ` (line ${thread.line})` : ''}: ${firstLine}\n  > ${excerpt}${comment.body.length > 300 ? '…' : ''}`;
            }).join('\n');

            // --- 5. Build comment ---
            const statusIcon = shouldBlock ? '🛑' : (overrideApproved ? '✅' : '✅');
            let statusText;

            if (blockingThreads.length === 0) {
              statusText = 'No unresolved Critical or Major CodeRabbit findings. Check passes.';
            } else if (overrideApproved) {
              statusText = `**Override accepted**: The \`${OVERRIDE_LABEL}\` label was added by \`${labelActorName}\`. A human has acknowledged the ${blockingThreads.length} finding(s) below.`;
            } else if (hasOverrideLabel && !labelAddedByHuman) {
              statusText = `**Action required**: The \`${OVERRIDE_LABEL}\` label was added by \`${labelActorName || 'unknown'}\`, which is not recognized as a human reviewer. A human must remove and re-add the label.`;
            } else {
              statusText = `**Action required**: This PR has ${blockingThreads.length} unresolved Critical/Major CodeRabbit finding(s). Either resolve each thread in the GitHub review interface, or add the \`${OVERRIDE_LABEL}\` label after reviewing and acknowledging each finding.`;
            }

            const body = [
              COMMENT_MARKER,
              `## ${statusIcon} CodeRabbit Security Gate`,
              '',
              statusText,
              '',
              blockingThreads.length > 0 ? [
                `### Unresolved Critical/Major Findings (${blockingThreads.length})`,
                '',
                threadDetails,
                '',
                blockingThreads.length > 10 ? `_...and ${blockingThreads.length - 10} more_\n` : '',
              ].join('\n') : '',
              '---',
              '',
              `> **How to resolve**: Mark each CodeRabbit thread as resolved in the "Files changed" tab, or add the \`${OVERRIDE_LABEL}\` label if the findings are false positives. See [#1649](https://github.com/quantified-uncertainty/longterm-wiki/issues/1649).`,
            ].filter(s => s !== '').join('\n');

            // Post or update the gate comment
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );
            const existing = comments.find(c => c.body && c.body.includes(COMMENT_MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else if (blockingThreads.length > 0) {
              // Only create the comment if there are findings (don't clutter clean PRs)
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            // Fail the check if blocking
            if (shouldBlock) {
              core.setFailed(
                `${blockingThreads.length} unresolved Critical/Major CodeRabbit finding(s) must be resolved or acknowledged before merging. ` +
                `Add the "${OVERRIDE_LABEL}" label after a human reviews each finding.`
              );
            } else {
              console.log('CodeRabbit security gate passed.');
            }
