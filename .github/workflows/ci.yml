name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
    # labeled/unlabeled needed for protected-paths-check and coderabbit-security-gate
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

# Cancel superseded runs for the same PR/branch (saves ~3 min per cancelled run).
# Runs on main and merge queue are never cancelled (each SHA produces a unique group).
# Label events get their own group so they don't cancel in-progress CI builds.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'label' || 'main' }}
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1: Build data (shared by validate and test jobs via artifact)
  # ---------------------------------------------------------------------------
  build-data:
    if: >-
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Block PRs to production from non-main branches
        if: github.event_name == 'pull_request' && github.base_ref == 'production'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != "main" ]]; then
            echo "::error::PRs to production must come from 'main'. Got: '$HEAD_REF'"
            echo "Merge your changes to main first, then the release workflow will open a PR from main → production."
            exit 1
          fi
          echo "::notice::Release PR: use 'Create a merge commit' — never squash. Squash merges cause conflicts on the next release."

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit
        continue-on-error: true
        run: pnpm audit --audit-level=high 2>/dev/null || echo "::warning::Dependency audit found high-severity vulnerabilities — run 'pnpm audit' locally for details"

      - name: Build data
        run: cd apps/web && node --import tsx/esm scripts/build-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}

      - name: Upload build data
        uses: actions/upload-artifact@v4
        with:
          name: build-data
          path: apps/web/src/data
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Phase 2a: Validate + Build Next.js (runs in parallel with test job)
  # ---------------------------------------------------------------------------
  validate:
    needs: [build-data]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build data
        uses: actions/download-artifact@v4
        with:
          name: build-data
          path: apps/web/src/data

      - name: Setup reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Install actionlint
        run: |
          gh release download --repo rhysd/actionlint --pattern 'actionlint_*_linux_amd64.tar.gz' -O /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
        env:
          GH_TOKEN: ${{ github.token }}

      - name: GitHub Actions YAML validation — actionlint (blocking)
        run: actionlint -shellcheck= .github/workflows/*.yml

      - name: Actionlint — reviewdog annotations
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          actionlint -shellcheck= -oneline .github/workflows/*.yml 2>&1 \
            | reviewdog -efm="%f:%l:%c: %m" -name="actionlint" \
              -reporter=github-pr-check \
              -filter-mode=added \
              -fail-level=none

      - name: Blocking validations
        run: |
          # Run all unified rules in errors-only mode (only ERROR-severity
          # rules fail). This catches every rule the local gate runs, so CI
          # and local gate stay in lock-step. Drift between the two caused
          # QUA-755 — local pre-push gate failed on 117+ errors that CI never
          # checked, blocking unrelated PRs because main "looked green."
          pnpm crux validate unified --errors-only
          pnpm crux validate schema
          pnpm crux validate refs

      - name: Auto-update orchestrator smoke test (dry-run)
        if: "!cancelled()"
        continue-on-error: true
        run: |
          pnpm crux auto-update run --dry-run --skip-fetch --trigger=ci-check --budget=0 --count=0 \
            || echo "::warning::Auto-update dry-run failed (advisory — check orchestrator for regressions)"

      - name: Crux validation — reviewdog annotations
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx tsx crux/validate/validate-unified.ts --ci \
            | npx tsx crux/validate/to-rdjsonl.ts \
            | reviewdog -f=rdjsonl -name="crux-validate" \
              -reporter=github-pr-check \
              -filter-mode=added \
              -fail-level=none

      - name: Run validation suite (advisory)
        if: "!cancelled()"
        continue-on-error: true
        run: |
          pnpm crux validate || echo "::warning::Validation has pre-existing failures (non-blocking)"

  # ---------------------------------------------------------------------------
  # Phase 2b: Next.js build (runs in parallel with validate + test)
  # ---------------------------------------------------------------------------
  build-nextjs:
    needs: [build-data]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build data
        uses: actions/download-artifact@v4
        with:
          name: build-data
          path: apps/web/src/data

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'content/docs/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build Next.js
        run: cd apps/web && pnpm build
        env:
          # Don't skip prebuild — let Next.js rebuild data from scratch so CI
          # generates the same page set as Vercel. Without this, CI may test
          # fewer pages than Vercel, missing prerender errors. See #3075.
          LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}

  # ---------------------------------------------------------------------------
  # Phase 2c: Type checks + Tests (runs in parallel with validate + build)
  # ---------------------------------------------------------------------------
  test:
    needs: [build-data]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build data
        uses: actions/download-artifact@v4
        with:
          name: build-data
          path: apps/web/src/data

      - name: TypeScript type checks (parallel)
        run: |
          pids=()
          (cd apps/web && npx tsc --noEmit) &
          pids+=($!)
          (cd apps/discord-bot && npx tsc --noEmit) &
          pids+=($!)
          (cd apps/wiki-server && npx tsc --noEmit) &
          pids+=($!)
          (cd apps/groundskeeper && npx tsc --noEmit) &
          pids+=($!)
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          exit $failed

      - name: .returning() guard check (blocking)
        run: npx tsx crux/validate/validate-returning-guard.ts

      - name: Drizzle migration journal integrity (blocking)
        run: npx tsx crux/validate/validate-drizzle-journal.ts

      - name: Run tests (parallel)
        run: |
          pids=()
          (cd apps/web && pnpm vitest run --coverage) &
          pids+=($!)
          (cd apps/discord-bot && pnpm vitest run --coverage) &
          pids+=($!)
          (cd apps/wiki-server && pnpm vitest run --coverage) &
          pids+=($!)
          (npx vitest run --config crux/vitest.config.ts --coverage) &
          pids+=($!)
          failed=0
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          exit $failed

      - name: Generate coverage report
        if: "!cancelled() && github.event_name == 'pull_request'"
        continue-on-error: true
        run: npx tsx crux/ci/merge-coverage.ts --output=/tmp/coverage-report.md

      - name: Post coverage comment on PR
        if: "!cancelled() && github.event_name == 'pull_request'"
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: /tmp/coverage-report.md

  # ---------------------------------------------------------------------------
  # Gate: preserves the 'ci' job name for branch protection rules
  # ---------------------------------------------------------------------------
  ci:
    needs: [build-data, validate, build-nextjs, test]
    # Skip on label events — dependent jobs skip too, so "skipped != success" would
    # cause a false failure on every label add/remove (e.g. agent:working).
    if: >-
      always() &&
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          echo "build-data:   ${{ needs.build-data.result }}"
          echo "validate:     ${{ needs.validate.result }}"
          echo "build-nextjs: ${{ needs.build-nextjs.result }}"
          echo "test:         ${{ needs.test.result }}"
          if [[ "${{ needs.build-data.result }}" != "success" ]] || \
             [[ "${{ needs.validate.result }}" != "success" ]] || \
             [[ "${{ needs.build-nextjs.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"

  # ---------------------------------------------------------------------------
  # Existing jobs (unchanged)
  # ---------------------------------------------------------------------------
  migrate-test:
    # Skip on label events — only gate checks need those.
    if: >-
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    name: Test DB migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: longterm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/longterm_test
        run: pnpm --filter wiki-server db:migrate

  sync-content:
    # Sync wiki page content to wiki-server after build succeeds on main.
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Serialize syncs so concurrent pushes don't saturate the wiki-server rate limiter.
    # cancel-in-progress: false — queue, don't cancel. Cancelling left the LATEST
    # commit's sync incomplete (so the wiki-server missed that commit's content)
    # AND turned the workflow rollup into FAILURE for cancelled commits, tripping
    # the patrol's main-ci-red gate on phantom failures (QUA-731).
    # Trade-off: an N-PR burst now serializes (≈N × sync duration ≈ 5 min for 5
    # PRs) instead of cancel-and-replace (~1 min). Each queued run still
    # checks-out at its own SHA and syncs that snapshot, so the queue tail's
    # final state matches the latest main commit. Acceptable for the volume.
    concurrency:
      group: sync-content-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build data
        run: cd apps/web && node --import tsx/esm scripts/build-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}

      - name: Sync pages to wiki-server
        run: pnpm crux wiki-server sync
        env:
          LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}

  # When CI fails on main, auto-file a GitHub issue labeled for agent pickup.
  # The groundskeeper issue-responder picks up `groundskeeper-autofix` issues
  # and spawns a Claude Code session to fix them automatically.
  file-regression-issue:
    needs: [ci]
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need at least 2 commits so the commit message lookup below resolves
          # the triggering commit, not just its tree.
          fetch-depth: 2

      - name: File regression issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On push to main, github.sha IS the merge commit. Use it directly
          # instead of scanning git log (which fails with default fetch-depth=1).
          LAST_SHA="${{ github.sha }}"
          LAST_MSG=$(git log -1 --format="%s" "$LAST_SHA")

          # Extract PR number from merge commit message if present
          PR_NUM=$(echo "$LAST_MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          PR_REF=""
          if [ -n "$PR_NUM" ]; then
            PR_REF=" (from PR #${PR_NUM})"
          fi

          TITLE="CI broken on main after ${LAST_SHA:0:7}${PR_REF}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="## Problem

          CI failed on \`main\` after merging commit \`${LAST_SHA:0:10}\`: ${LAST_MSG}

          Run: ${RUN_URL}

          ## Suggested Fix

          Check the failing CI step in the run above, identify the regression, and fix it.

          ## Acceptance Criteria

          - [ ] CI passes on main
          - [ ] Root cause identified and fixed"
          # Strip leading whitespace from each line (heredoc-style dedent)
          BODY=$(echo "$BODY" | sed 's/^          //')

          # Check for an existing open issue to avoid duplicates
          EXISTING=$(gh issue list --label "groundskeeper-autofix" --state open --limit 5 --json title --jq '.[].title' | grep -c "CI broken on main" || true)
          if [ "$EXISTING" -gt 0 ]; then
            echo "Existing CI-broken issue already open — skipping duplicate."
            exit 0
          fi

          gh issue create --title "$TITLE" --body "$BODY" --label "bug,groundskeeper-autofix"

  deploy:
    # Trigger Vercel production deployment after CI passes on the production branch.
    # Vercel GitHub integration is disabled (vercel.json github.enabled=false) to
    # prevent PR failure statuses — deploy hooks bypass the GitHub integration.
    # The VERCEL_PRODUCTION_DEPLOY_HOOK_URL secret must be a hook configured for the "production" branch.
    # VERCEL_MAIN_DEPLOY_HOOK_URL is a separate hook for the "main" branch (used by scheduled-deploy.yml).
    needs: [ci, migrate-test]
    if: vars.AUTOMATION_PAUSED != 'true' && github.ref == 'refs/heads/production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Vercel production deployment
        run: |
          if [ -z "${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::VERCEL_PRODUCTION_DEPLOY_HOOK_URL secret is not set."
            echo "Go to Vercel Dashboard → Project → Settings → Git → Deploy Hooks"
            echo "Create a hook for Branch 'production', then add the URL as a GitHub secret."
            exit 1
          fi

          RESPONSE=$(curl -s -o /tmp/vercel_response.json -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK_URL }}")

          echo "HTTP status: $RESPONSE"
          cat /tmp/vercel_response.json

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "Production deployment triggered."
          else
            echo "::error::Vercel deploy hook returned HTTP $RESPONSE"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # PR gate checks (merged from standalone workflows)
  #
  # These were previously separate workflow files. They run only on PRs and are
  # lightweight enough to be jobs in ci.yml. If any of these were required status
  # checks, branch protection rules may need updating to match the new job names.
  #
  # Merged workflows:
  #   - pr-size-check.yml          → pr-size-check
  #   - protected-paths-check.yml  → protected-paths-check
  #   - squawk-lint.yml            → squawk-lint
  #   - migration-integrity.yml    → migration-integrity
  #   - coderabbit-security-gate.yml → coderabbit-security-gate
  # ---------------------------------------------------------------------------

  pr-size-check:
    name: PR Size Check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size and comment if large
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { execSync } = require('child_process');
            const WARN_THRESHOLD = 500;
            const LARGE_THRESHOLD = 1000;

            // Get per-file diff stats, filtering out test/generated/content files.
            // We only count non-test infrastructure additions since large infra PRs
            // correlate with post-merge bugs; test and content PRs are low-risk.
            //
            // Excluded patterns:
            //   *.test.ts / *.test.tsx / *.spec.ts — test files
            //   content/docs/** — MDX wiki content (low risk)
            //   **/*.snap — Jest/Vitest snapshots
            //   apps/web/public/** — static assets
            //   pnpm-lock.yaml — generated lockfile
            const BASE = process.env.BASE_SHA;
            const HEAD = process.env.HEAD_SHA;
            const rawDiff = execSync(
              `git diff --numstat ${BASE}...${HEAD}`,
              { encoding: 'utf-8' }
            );

            const EXCLUDED = [
              /\.test\.[jt]sx?$/,
              /\.spec\.[jt]sx?$/,
              /^content\/docs\//,
              /\.snap$/,
              /^apps\/web\/public\//,
              /^pnpm-lock\.yaml$/,
            ];

            let infraAdditions = 0;
            let totalAdditions = 0;
            let totalDeletions = 0;
            let filesChanged = 0;

            for (const line of rawDiff.trim().split('\n').filter(Boolean)) {
              const [adds, dels, file] = line.split('\t');
              if (!file) continue;
              const addCount = parseInt(adds, 10) || 0;
              const delCount = parseInt(dels, 10) || 0;
              totalAdditions += addCount;
              totalDeletions += delCount;
              filesChanged++;
              const isExcluded = EXCLUDED.some(p => p.test(file));
              if (!isExcluded) {
                infraAdditions += addCount;
              }
            }

            console.log(
              `PR additions: ${totalAdditions} total, ${infraAdditions} non-test/content ` +
              `(${totalDeletions} deletions, ${filesChanged} files)`
            );

            if (infraAdditions <= WARN_THRESHOLD) {
              console.log(`PR size OK: ${infraAdditions} non-test additions (threshold: ${WARN_THRESHOLD})`);
              return;
            }

            // Check if we already posted a size warning (avoid duplicates on re-push)
            const MARKER = '<!-- pr-size-check -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(MARKER));

            const level = infraAdditions > LARGE_THRESHOLD ? 'large' : 'medium';
            const emoji = level === 'large' ? '🔴' : '🟡';
            const body = [
              MARKER,
              `${emoji} **PR Size Warning**: ${infraAdditions} non-test additions across ${filesChanged} files.`,
              '',
              level === 'large'
                ? `This PR exceeds ${LARGE_THRESHOLD} non-test additions. Consider splitting into smaller, staged PRs (see [#1252](https://github.com/quantified-uncertainty/longterm-wiki/issues/1252)).`
                : `This PR exceeds ${WARN_THRESHOLD} non-test additions. If possible, consider whether it could be split into smaller PRs.`,
              '',
              `_Test files, wiki content, snapshots, and lockfiles are excluded from this count (low-risk additions)._`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Non-test additions | +${infraAdditions} |`,
              `| Total additions | +${totalAdditions} |`,
              `| Deletions | -${totalDeletions} |`,
              `| Files changed | ${filesChanged} |`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated existing size warning (${infraAdditions} non-test additions)`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log(`Posted size warning (${infraAdditions} non-test additions)`);
            }

  protected-paths-check:
    # Flags PRs that modify agent behavioral rules, CI workflows, or validation
    # code for mandatory human review. Without the `gate:rules-ok` label,
    # the check fails so these changes cannot merge unnoticed.
    name: Protected Paths Check
    # Release PRs (main → production) are exempt: individual PRs already
    # went through protected-paths review before merging to main.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref != 'production' && (
        github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
        github.event.label.name == 'gate:rules-ok'
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check for protected path changes
        uses: actions/github-script@v7
        with:
          script: |
            const PROTECTED_PATTERNS = [
              /^CLAUDE\.md$/,
              /^\.claude\/rules\//,
              /^\.claude\/memory\//,
              /^\.claude\/commands\//,
              /^\.claude\/settings\.json$/,
              /^\.claude\/hooks\//,
              /^\.github\/workflows\//,
              /^\.githooks\//,
              /^crux\/validate\//,
              /^crux\/commands\//,
              /^crux\/lib\/session-checklist\.ts$/,
              /^crux\/lib\/page-templates\.ts$/,
              /^crux\/auto-update\//,
              /^\.squawk\.toml$/,
            ];

            const REVIEW_LABEL = 'gate:rules-ok';
            const COMMENT_MARKER = '<!-- protected-paths-check -->';

            // Get list of files changed in this PR
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              }
            );

            const changedPaths = files.map(f => f.filename);
            const protectedFiles = changedPaths.filter(path =>
              PROTECTED_PATTERNS.some(pattern => pattern.test(path))
            );

            if (protectedFiles.length === 0) {
              console.log('No protected paths modified. Check passes.');
              return;
            }

            console.log(`Protected files modified:\n${protectedFiles.join('\n')}`);

            // Check if the bypass label is present
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const hasLabel = labels.some(l => l.name === REVIEW_LABEL);

            // Post or update advisory comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(COMMENT_MARKER));

            const body = [
              COMMENT_MARKER,
              `### Protected paths modified`,
              '',
              'This PR modifies files that affect agent behavior, CI, or validation rules.',
              'A human must review these changes and add the `gate:rules-ok` label to unblock merge.',
              '',
              '**Modified protected files:**',
              ...protectedFiles.map(f => `- \`${f}\``),
              '',
              hasLabel
                ? '> **Status:** `gate:rules-ok` label is present. This check will pass.'
                : '> **Status:** Waiting for `gate:rules-ok` label. Add it after reviewing the changes above.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            if (!hasLabel) {
              core.setFailed(
                `Protected paths modified without '${REVIEW_LABEL}' label. ` +
                `Add the label after human review to unblock merge.`
              );
            }

  squawk-lint:
    name: SQL Migration Lint (squawk)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect new migration files
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A "$BASE_SHA"..."$HEAD_SHA" -- 'apps/wiki-server/drizzle/*.sql' | tr '\n' ' ')
          echo "files=$NEW_MIGRATIONS" >> "$GITHUB_OUTPUT"
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "No new migration files detected."
          else
            echo "New migrations: $NEW_MIGRATIONS"
          fi

      - name: Run squawk lint
        if: steps.detect.outputs.files != ''
        uses: sbdchd/squawk-action@v1
        with:
          pattern: ${{ steps.detect.outputs.files }}

  migration-integrity:
    name: Migration Integrity Check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration file prefixes are unique
        run: npx tsx crux/validate/validate-drizzle-journal.ts

  coderabbit-security-gate:
    name: CodeRabbit Security Gate
    if: >-
      github.event_name == 'pull_request' && (
        github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
        github.event.label.name == 'gate:coderabbit-ok'
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check for security-related CodeRabbit comments
        uses: actions/github-script@v7
        with:
          script: |
            const BYPASS_LABEL = 'gate:coderabbit-ok';
            const SECURITY_KEYWORDS = [
              'injection', 'xss', 'csrf', 'ssrf', 'rce',
              'remote code execution', 'sql injection',
              'command injection', 'path traversal',
              'authentication bypass', 'authorization bypass',
              'insecure', 'vulnerability', 'cve-',
              'secret', 'credential', 'hardcoded',
              'unsanitized', 'unvalidated',
            ];

            // Check bypass label
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            if (labels.some(l => l.name === BYPASS_LABEL)) {
              console.log(`'${BYPASS_LABEL}' label present — skipping CodeRabbit security gate.`);
              return;
            }

            // Get review comments from CodeRabbit
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const coderabbitReviews = reviews.filter(
              r => r.user?.login === 'coderabbitai' || r.user?.login === 'coderabbit-ai[bot]'
            );

            if (coderabbitReviews.length === 0) {
              console.log('No CodeRabbit reviews found. Check passes.');
              return;
            }

            // Check for security-related content
            const securityFindings = [];
            for (const review of coderabbitReviews) {
              const body = (review.body || '').toLowerCase();
              const matches = SECURITY_KEYWORDS.filter(kw => body.includes(kw));
              if (matches.length > 0) {
                securityFindings.push({
                  id: review.id,
                  keywords: matches,
                  snippet: review.body?.substring(0, 200),
                });
              }
            }

            if (securityFindings.length === 0) {
              console.log('No security-related CodeRabbit findings. Check passes.');
              return;
            }

            console.log(`Found ${securityFindings.length} security-related CodeRabbit review(s):`);
            for (const f of securityFindings) {
              console.log(`  Review ${f.id}: keywords=[${f.keywords.join(', ')}]`);
              console.log(`  Preview: ${f.snippet}...`);
            }

            core.setFailed(
              `CodeRabbit flagged ${securityFindings.length} potential security issue(s). ` +
              `Review the findings above, then add the '${BYPASS_LABEL}' label if they are false positives or already addressed.`
            );
