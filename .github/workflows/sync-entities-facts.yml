name: Sync Entities & Facts
run-name: "Sync Entities & Facts${{ vars.AUTOMATION_PAUSED == 'true' && ' [PAUSED]' || '' }}"

on:
  push:
    branches: [main, production]
    paths:
      - "data/entities/**"
      - "packages/factbase/data/fb-entities/**"
      # Also trigger when the sync/prune pipeline or workflow config changes,
      # so that new prune logic is exercised immediately after merge. See #2796.
      - "crux/wiki-server/sync-entities.ts"
      - "crux/wiki-server/sync-facts.ts"
      - "apps/wiki-server/src/routes/tablebase/entities.ts"
      - "apps/wiki-server/src/routes/factbase/facts.ts"
      - ".github/workflows/sync-entities-facts.yml"

  # Run weekly to catch stale entities/facts that missed path-triggered syncs.
  # Ghost entries can persist if entity YAML is deleted but the sync workflow
  # doesn't trigger (e.g., production branch is stale). See #2796.
  schedule:
    - cron: "0 7 * * 1" # Every Monday at 07:00 UTC

  # Allow manual trigger for full re-sync
  workflow_dispatch:

# Cancel superseded runs for the same trigger
concurrency:
  group: sync-entities-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paused-notice:
    uses: ./.github/workflows/_paused-notice.yml

  preflight:
    # Global circuit breaker — skip when automation is paused or wiki-server is down.
    if: vars.AUTOMATION_PAUSED != 'true'
    uses: ./.github/workflows/_preflight-wiki-server.yml
    secrets: inherit

  # On production pushes, wait for the wiki-server deploy to complete before
  # syncing. The deploy may include schema migrations that the sync depends on.
  # Without this, the sync can race the migration and write data that conflicts
  # with the migration's transforms (incident 2026-03-29, issue #3418).
  wait-for-deploy:
    if: github.ref == 'refs/heads/production'
    needs: [preflight]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for wiki-server deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for wiki-server deploy workflow to complete..."
          CONCLUSION=""
          FOUND=false
          for i in $(seq 1 40); do
            RUN_STATUS=$(gh run list \
              --workflow=wiki-server-docker.yml \
              --commit "${{ github.sha }}" \
              --json status,conclusion \
              --jq '.[0].status // "not_found"' \
              -R "${{ github.repository }}" 2>/dev/null || echo "not_found")

            if [ "$RUN_STATUS" = "completed" ]; then
              FOUND=true
              CONCLUSION=$(gh run list \
                --workflow=wiki-server-docker.yml \
                --commit "${{ github.sha }}" \
                --json conclusion \
                --jq '.[0].conclusion' \
                -R "${{ github.repository }}")
              echo "Wiki-server deploy completed: $CONCLUSION"
              break
            elif [ "$RUN_STATUS" = "not_found" ]; then
              echo "No wiki-server deploy found for this commit (paths may not have changed)"
              FOUND=true
              CONCLUSION="skipped"
              break
            fi

            echo "Attempt $i/40: deploy status=$RUN_STATUS, waiting 15s..."
            sleep 15
          done

          # Fail if deploy failed or we timed out waiting
          if [ "$FOUND" = "false" ]; then
            echo "::error::Timed out waiting for wiki-server deploy (10 min). Blocking sync to prevent race."
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ] && [ "$CONCLUSION" != "skipped" ]; then
            echo "::error::Wiki-server deploy did not succeed (conclusion=$CONCLUSION). Blocking sync."
            exit 1
          fi

  sync:
    needs: [preflight, wait-for-deploy]
    if: ${{ !cancelled() && (needs.wait-for-deploy.result == 'success' || needs.wait-for-deploy.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate schemas
        run: pnpm crux validate schema

      - name: Sync entities to wiki-server
        run: pnpm crux wiki-server sync-entities
        env:
          LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}

      - name: Sync facts to wiki-server
        run: pnpm crux wiki-server sync-facts
        env:
          LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}
