name: Scheduled Source-Check
run-name: "Source-Check${{ vars.AUTOMATION_PAUSED == 'true' && ' [PAUSED]' || '' }}${{ inputs.dry_run == true && ' [DRY RUN]' || '' }}"

# Periodic source-checking of facts and records against cited URLs.
# Uses the Anthropic Batch API (50% cost discount) via `crux verify-orchestrate`.

on:
  schedule:
    - cron: '0 4 * * 1'  # Weekly Monday 4am UTC
  workflow_dispatch:
    inputs:
      budget:
        description: 'Max budget in dollars'
        required: false
        default: '5'
        type: string
      table:
        description: 'Table to check (personnel|grants|funding-rounds|all)'
        required: false
        default: 'all'
        type: string
      dry_run:
        description: 'Dry run (no API calls)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: source-check
  cancel-in-progress: false

jobs:
  paused-notice:
    uses: ./.github/workflows/_paused-notice.yml

  preflight:
    if: vars.AUTOMATION_PAUSED != 'true'
    uses: ./.github/workflows/_preflight-wiki-server.yml
    secrets: inherit

  source-check:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIKI_SERVER_ENV: prod
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROD_LONGTERMWIKI_SERVER_URL: ${{ secrets.PROD_LONGTERMWIKI_SERVER_URL }}
      PROD_LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.PROD_LONGTERMWIKI_SERVER_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Assign inputs to env vars to avoid shell injection (GitHub Actions best practice)
      INPUT_BUDGET: ${{ inputs.budget || '5' }}
      INPUT_TABLE: ${{ inputs.table || 'all' }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run source-check
        run: |
          ARGS="--budget=${INPUT_BUDGET} --verbose"

          if [ "${INPUT_TABLE}" != "all" ]; then
            ARGS="$ARGS --table=${INPUT_TABLE}"
          fi

          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          pnpm crux verify-orchestrate $ARGS
