name: CI & PR Health
run-name: "CI & PR Health${{ vars.AUTOMATION_PAUSED == 'true' && ' [PAUSED]' || '' }}"

# Checks GitHub Actions workflow health, job queue status, and PR/issue quality.
# Also cleans up stale working labels (agent:working, pr-patrol:working).
# Runs twice daily — same schedule as the unified wellness check it replaced.
#
# Checks performed:
#   - GitHub Actions workflow health (scheduled jobs running?)
#   - Job queue health (failure rates, pending backlogs)
#   - PR & issue quality (empty bodies, stale PRs, stuck labels)
#
# Issues are created/updated/closed automatically under the "wellness" label.

on:
  # schedule disabled 2026-09: repo idle since 2026-06-25; re-enable by uncommenting.
  # Manual runs still work via workflow_dispatch.
  # schedule:
  #  - cron: "10 8 * * *" # 8:10 AM UTC daily (staggered +10min from server-api-health to avoid duplicate issue creation)
  #  - cron: "10 20 * * *" # 8:10 PM UTC daily
  workflow_dispatch:

concurrency:
  group: ci-pr-health
  cancel-in-progress: false

permissions: {}

jobs:
  paused-notice:
    uses: ./.github/workflows/_paused-notice.yml

  preflight:
    # Global circuit breaker — skip when automation is paused.
    if: vars.AUTOMATION_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automation is active"

  check:
    needs: [preflight]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
      pull-requests: read
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: GitHub Actions health
        run: pnpm crux health check --check=actions --report --auto-issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # QUA-667: required for Linear-side dedup (see crux/health/wellness-linear-dedup.ts).
          # Without this the dedup silently falls back to GitHub create, which Linear's
          # GitHub integration mirrors into a brand-new QUA ticket each run.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      - name: Job queue health
        run: pnpm crux health check --check=job-queue --report --auto-issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}
          # QUA-583: crux health defaults to WIKI_SERVER_ENV=prod, which reads PROD_* vars.
          PROD_LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          PROD_LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}
      - name: PR & issue quality
        run: pnpm crux health check --check=pr-quality --report --auto-issue --cleanup-labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
