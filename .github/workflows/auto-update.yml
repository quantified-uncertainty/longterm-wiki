name: Auto-Update Wiki
run-name: "Auto-Update Wiki${{ vars.AUTOMATION_PAUSED == 'true' && ' [PAUSED]' || '' }}"

# News-driven automatic wiki update system.
# All pipeline logic lives in `crux/auto-update/ci-orchestrate.ts`.
# This workflow handles only: trigger, permissions, setup, and the single crux call.

on:
  # schedule disabled — run locally with `pnpm crux auto-update run` or trigger manually via workflow_dispatch
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Max budget in dollars'
        required: false
        default: '30'
        type: string
      count:
        description: 'Max pages to update'
        required: false
        default: '3'
        type: string
      dry_run:
        description: 'Dry run (no page improvements)'
        required: false
        default: false
        type: boolean
      sources:
        description: 'Comma-separated source IDs (empty = all)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

# Only one auto-update run at a time
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  paused-notice:
    uses: ./.github/workflows/_paused-notice.yml

  preflight:
    # Global circuit breaker — skip when automation is paused or wiki-server is down.
    if: vars.AUTOMATION_PAUSED != 'true'
    uses: ./.github/workflows/_preflight-wiki-server.yml
    secrets: inherit

  auto-update:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full clone needed for reliable git push. Shallow clones (fetch-depth: 1)
          # cause push failures: git cannot negotiate objects with the remote,
          # leading to 2-minute hangs and generic "failed to push some refs" errors.
          # See issue #2093.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build data layer
        run: cd apps/web && node --import tsx/esm scripts/build-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}
          LLM_PAYLOAD_CAPTURE_RATE: ${{ vars.LLM_PAYLOAD_CAPTURE_RATE }}

      - name: Restore auto-update state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/auto-update/state.yaml
          key: auto-update-state-${{ github.run_id }}
          restore-keys: |
            auto-update-state-

      - name: Run auto-update CI pipeline
        env:
          ANTHROPIC_BILLING_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SCRY_API_KEY: ${{ secrets.SCRY_API_KEY }}
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}
          LLM_PAYLOAD_CAPTURE_RATE: ${{ vars.LLM_PAYLOAD_CAPTURE_RATE }}
        run: |
          ARGS="--budget=${{ inputs.budget || '30' }} --count=${{ inputs.count || '3' }} --verbose"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          if [ -n "${{ inputs.sources }}" ]; then
            ARGS="$ARGS --sources=${{ inputs.sources }}"
          fi

          echo "Running: pnpm crux auto-update run-ci $ARGS"
          pnpm crux auto-update run-ci $ARGS

      - name: Save auto-update state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/auto-update/state.yaml
          key: auto-update-state-${{ github.run_id }}
