name: Daily Data Validation
run-name: "Daily Data Validation${{ vars.AUTOMATION_PAUSED == 'true' && ' [PAUSED]' || '' }}"

# Runs all data validators daily to catch drift in production data.
# Validators are split into two groups:
#   - Local: run against YAML/MDX/FactBase data in the repo
#   - Server: require wiki-server access for PG-backed data
#
# Only "blocking" validator failures cause the workflow to fail.
# "Advisory" failures are reported in the job summary but don't fail the run.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily (after auto-update at 06:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-validation
  cancel-in-progress: false

jobs:
  paused-notice:
    uses: ./.github/workflows/_paused-notice.yml

  validate:
    # Global circuit breaker — skip when automation is paused.
    if: vars.AUTOMATION_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build data layer
        run: cd apps/web && node --import tsx/esm scripts/build-data.mjs
        env:
          WIKI_SERVER_ENV: prod
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # QUA-396: repo secrets are unprefixed — no PROD_ variant exists.
          PROD_LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          PROD_LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}

      # Run all validators via the unified daily runner.
      # WIKI_SERVER_ENV=prod causes validators to read PROD_LONGTERMWIKI_*
      # env vars, pointing server-dependent checks at the production DB.
      - name: Run daily validation suite
        id: validate
        env:
          WIKI_SERVER_ENV: prod
          # QUA-396: repo secrets are unprefixed — no PROD_ variant exists.
          PROD_LONGTERMWIKI_SERVER_URL: ${{ secrets.LONGTERMWIKI_SERVER_URL }}
          PROD_LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.LONGTERMWIKI_SERVER_API_KEY }}
        run: npx tsx crux/validate/validate-daily.ts --ci
