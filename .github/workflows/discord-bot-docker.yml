name: Discord Bot — Build & Push Image

on:
  push:
    branches: [production]
    paths:
      - "apps/discord-bot/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/discord-bot-docker.yml"
  workflow_dispatch:

concurrency:
  group: discord-bot-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/quantified-uncertainty/longterm-wiki-discord-bot
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/discord-bot/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=discord-bot
          cache-to: type=gha,scope=discord-bot,mode=max

      - name: Update ArgoCD image tag
        if: github.ref == 'refs/heads/production'
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          IMAGE_TAG="sha-${{ github.sha }}"
          echo "Deploying image tag: $IMAGE_TAG"

          # Download ArgoCD CLI from pinned GitHub release (not from ARGOCD_SERVER,
          # which would allow arbitrary code execution if the secret is compromised)
          ARGOCD_VERSION="v3.3.1"
          curl -sSL -o /usr/local/bin/argocd \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          chmod +x /usr/local/bin/argocd

          argocd app set longterm-wiki-discord-bot \
            --helm-set image.tag="${IMAGE_TAG}" \
            --auth-token "${ARGOCD_AUTH_TOKEN}" \
            --server "${ARGOCD_SERVER}" \
            --grpc-web

          argocd app wait longterm-wiki-discord-bot \
            --health \
            --timeout 300 \
            --auth-token "${ARGOCD_AUTH_TOKEN}" \
            --server "${ARGOCD_SERVER}" \
            --grpc-web
