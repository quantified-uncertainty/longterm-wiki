name: Worker — Build & Deploy

on:
  push:
    branches: [production]
    paths:
      - 'crux/worker/**'
      - 'crux/lib/**'
      - 'docker/worker/**'
      - 'Dockerfile.worker'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/worker-docker.yml'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Build only, skip ArgoCD deploy'
        required: false
        default: false
        type: boolean

concurrency:
  group: worker-docker-${{ github.ref }}
  # Never cancel deploy workflows — the latest push must always deploy.
  # cancel-in-progress caused a stale image to deploy when two releases
  # landed in quick succession (incident 2026-03-29, issue #3418).
  cancel-in-progress: false

permissions: {}

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/quantified-uncertainty/longterm-wiki-worker
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  deploy:
    name: Deploy to ArgoCD
    needs: build-and-push
    if: >-
      github.ref == 'refs/heads/production'
      && inputs.skip_deploy != true
    runs-on: ubuntu-latest

    steps:
      - name: Update ArgoCD image tag
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          IMAGE_TAG="sha-${{ github.sha }}"
          echo "Deploying image tag: $IMAGE_TAG"

          # Download ArgoCD CLI from pinned GitHub release
          ARGOCD_VERSION="v3.3.1"
          curl -sSL -o /usr/local/bin/argocd \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          chmod +x /usr/local/bin/argocd

          argocd app set longterm-wiki-worker \
            --helm-set image.tag="${IMAGE_TAG}" \
            --auth-token "${ARGOCD_AUTH_TOKEN}" \
            --server "${ARGOCD_SERVER}" \
            --grpc-web

          argocd app wait longterm-wiki-worker \
            --health \
            --timeout 300 \
            --auth-token "${ARGOCD_AUTH_TOKEN}" \
            --server "${ARGOCD_SERVER}" \
            --grpc-web
