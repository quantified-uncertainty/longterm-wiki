name: Source-Check Recheck
run-name: "Source-Check Recheck${{ vars.AUTOMATION_PAUSED == 'true' && ' [PAUSED]' || '' }}"

# Re-verifies stale source-check verdicts on a weekly schedule.
# Detects when previously-verified data becomes contradicted by updated sources.

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:
    inputs:
      budget:
        description: 'Max budget in dollars'
        required: false
        default: '15'
        type: string
      limit:
        description: 'Max items to recheck'
        required: false
        default: '500'
        type: string
      record_type:
        description: 'Filter by record type (empty = all)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (preview only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: source-check-recheck
  cancel-in-progress: false

jobs:
  paused-notice:
    uses: ./.github/workflows/_paused-notice.yml

  recheck:
    if: vars.AUTOMATION_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIKI_SERVER_ENV: prod
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROD_LONGTERMWIKI_SERVER_URL: ${{ secrets.PROD_LONGTERMWIKI_SERVER_URL }}
      PROD_LONGTERMWIKI_SERVER_API_KEY: ${{ secrets.PROD_LONGTERMWIKI_SERVER_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Assign inputs to env vars to avoid shell injection (GitHub Actions best practice)
      INPUT_BUDGET: ${{ inputs.budget || '15' }}
      INPUT_LIMIT: ${{ inputs.limit || '500' }}
      INPUT_RECORD_TYPE: ${{ inputs.record_type }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run source-check recheck
        run: |
          ARGS="--budget=${INPUT_BUDGET} --limit=${INPUT_LIMIT}"
          if [ -n "${INPUT_RECORD_TYPE}" ]; then
            ARGS="$ARGS --type=${INPUT_RECORD_TYPE}"
          fi
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          pnpm crux source-check-recheck $ARGS --ci 2>&1 | tee /tmp/recheck-output.txt

      - name: Check for verdict flips
        if: always()
        run: |
          # Parse CI output for verdict changes
          if grep -q '"changed":' /tmp/recheck-output.txt 2>/dev/null; then
            CHANGED=$(cat /tmp/recheck-output.txt | jq -r '.changed // 0' 2>/dev/null || echo "0")
            if [ "$CHANGED" -gt "0" ]; then
              echo "::warning::$CHANGED verdict(s) changed during recheck — review source-check dashboard"
            fi
          fi
