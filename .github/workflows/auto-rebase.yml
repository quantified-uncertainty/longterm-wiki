name: Auto-Rebase PRs
run-name: "Auto-Rebase PRs${{ vars.AUTOMATION_PAUSED == 'true' && ' [PAUSED]' || '' }}"

# Rebase all open PRs onto main to surface conflicts early.
# Logic lives in crux/lib/pr-rebase.ts; this workflow is a thin orchestrator.
#
# Safeguards (implemented in TypeScript):
#   1. Skip PRs with any working label (`agent:working`, `pr-patrol:working`)
#   2. Skip PRs updated within 30 minutes (active work)
#   3. Skip branches with commits pushed within 30 minutes (active work)
#   4. Skip branches where last commit contains [ci-autofix] (feedback loop)
#   5. Skip PRs with the `stage:merging` label (in merge queue — rebase would invalidate entry)

on:
  # schedule disabled 2026-09: repo idle since 2026-06-25; re-enable by uncommenting.
  # Manual runs still work via workflow_dispatch.
  # schedule:
  #  - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch:          # allow manual trigger

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: auto-rebase
  cancel-in-progress: true

jobs:
  paused-notice:
    uses: ./.github/workflows/_paused-notice.yml

  preflight:
    if: vars.AUTOMATION_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automation is active"

  rebase:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm crux pr rebase-all --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
